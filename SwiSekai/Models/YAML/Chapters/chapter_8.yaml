chapters:
- chapterName: 'Chapter 8: Advanced Swift'
  modules:
  - id: C871112D-81B3-4ECC-9371-4EFE47A68D67
    module_name: Optionals
    module_number: 25
    multiple_choice:
    - question: Which symbol marks an optional type in Swift?
      options:
      - '?'
      - '!'
      - '*'
      - '@'
      answer: '?'
    - question: What does nil represent for an optional?
      options:
      - Zero
      - An empty string
      - No value
      - 'False'
      answer: No value
    - question: Which keywords safely unwrap an optional?
      options:
      - if let / guard let
      - force unwrap
      - var let
      - unwrap now
      answer: if let / guard let
    content_blocks:
    - type: heading1
      content:
        text: Optionals
    - type: explanation
      content:
        text: 'Think of optionals as mystery boxes or wrapped presents: they might hold a treasure inside—or they might be empty. Swift requires you to check the box carefully before you peek inside to avoid surprises.'
    - type: heading2
      content:
        text: Declaring optionals
    - type: snippet
      content:
        code: 'var nickname: String? = nil

nickname = "Ace"'
    - type: explanation
      content:
        text: 'The ? means this variable can hold a String or nothing at all—like an empty box. That "nothing" is called nil, meaning there''s nothing inside the box.'
    - type: heading2
      content:
        text: Safe unwrapping with if let
    - type: snippet
      content:
        code: "if let name = nickname {\n  print(\"Hello, \\(name)\")\n} else {\n  print(\"No nickname yet\")\n}"
    - type: explanation
      content:
        text: 'Using if let is like carefully opening the box and looking inside only if there''s something there. Inside the block, name is a regular String, so you can use it safely.'
    - type: heading2
      content:
        text: Early exit with guard let
    - type: snippet
      content:
        code: "func greet(_ nick: String?) {\n  guard let nick = nick else { print(\"Missing\"); return }\n  print(\"Yo, \\(nick)\")\n}\ngreet(nickname)"
    - type: explanation
      content:
        text: 'guard let is like checking the box early—if it''s empty, you exit right away. This keeps your code clean and focused on the happy path, without deep nesting.'
    - type: heading2
      content:
        text: Careful with force unwrap
    - type: snippet
      content:
        code: let forced = nickname!  // Crashes if nickname is nil
    - type: explanation
      content:
        text: 'Using ! to force unwrap is like cutting open the mystery box blindfolded—you might get the treasure, or you might crash the program if it''s empty. Only use it when you''re 100% sure something is inside.'
    - type: heading2
      content:
        text: Mini Challenge
    - type: explanation
      content:
        text: 'Make an optional Int called score, give it a value, then safely unwrap it and print it.'
    - type: heading2
      content:
        text: Reflection
    - type: explanation
      content:
        text: 'When would you choose guard let over if let? Think about situations where early exit keeps your code cleaner and easier to read.'
  - id: D2741D59-BADB-4864-9294-0C03FE097E8B
    module_name: Typecasting
    module_number: 26
    multiple_choice:
    - question: Which operator attempts a safe cast and returns an optional?
      options:
      - as?
      - as!
      - as
      - is
      answer: as?
    - question: Which operator forces a cast and will crash if it fails?
      options:
      - as!
      - as?
      - is
      - ->
      answer: as!
    - question: Which keyword checks type without casting?
      options:
      - is
      - as?
      - as!
      - try
      answer: is
    content_blocks:
    - type: heading1
      content:
        text: Typecasting
    - type: explanation
      content:
        text: 'Typecasting is like asking an instance, "What costume are you wearing right now?" at runtime. Sometimes you just want to check (is), sometimes you ask politely (as?), and sometimes you demand it and risk a crash (as!).'
    - type: heading2
      content:
        text: Checking type
    - type: snippet
      content:
        code: 'let pet: Any = "Dog"

print(pet is String)  // true'
    - type: explanation
      content:
        text: 'Use is to check what type an instance is before trying to cast it—think of it as a quick peek at the costume.'
    - type: heading2
      content:
        text: Safe casting with as?
    - type: snippet
      content:
        code: "let animal: Any = 7\nif let n = animal as? Int {\n  print(n * 2)  // 14\n} else {\n  print(\"Not an Int\")\n}"
    - type: explanation
      content:
        text: 'as? asks politely: "Are you really an Int?" If yes, you get the value; if not, you get nil and can handle it gracefully.'
    - type: heading2
      content:
        text: Forced casting with as!
    - type: snippet
      content:
        code: 'let value: Any = "42"

let s = value as! String  // Crashes if not String'
    - type: explanation
      content:
        text: 'as! demands the cast and crashes if you''re wrong—use it only when you''re sure of the type.'
    - type: heading2
      content:
        text: Mini Challenge
    - type: explanation
      content:
        text: 'Try storing different values in Any, then safely cast them back with as?. Notice how you can avoid crashes by handling the optional result.'
    - type: heading2
      content:
        text: Reflection
    - type: explanation
      content:
        text: 'Why is safe casting (as?) preferred most of the time? Think about how it helps you write safer, more stable code.'
  - id: 74A9A7C4-B488-4338-AA1F-080DDF85C779
    module_name: Access Control & Laziness
    module_number: 27
    multiple_choice:
    - question: Which keyword makes a symbol visible only inside the same type or
        file scope?
      options:
      - private
      - public
      - open
      - internal
      answer: private
    - question: Which keyword delays property initialization until first use?
      options:
      - lazy
      - defer
      - delay
      - optional
      answer: lazy
    - question: Which access level exposes a symbol within the same module by default?
      options:
      - internal
      - public
      - open
      - fileprivate
      answer: internal
    content_blocks:
    - type: heading1
      content:
        text: Access Control & Laziness
    - type: explanation
      content:
        text: 'Access control is like doors with different locks: public doors anyone can open, internal doors open only within the same building (module), and private locked drawers only you can open. Lazy properties are like cooking a meal only when you''re ready to eat it—saving energy and time.'
    - type: heading2
      content:
        text: Access levels
    - type: snippet
      content:
        code: 'public struct API {}

internal var cache = [String: String]()

private func reset() { cache.removeAll() }'
    - type: explanation
      content:
        text: 'public means anyone can access it, internal means only inside the same module, and private means only inside the same type or file—like secret drawers.'
    - type: heading2
      content:
        text: Lazy properties
    - type: snippet
      content:
        code: "struct DataLoader {\n  lazy var data: [Int] = {\n    print(\"Loading...\")\n    return Array(0...3)\n  }()\n}\nvar loader = DataLoader()\nprint(\"Before access\")\nprint(loader.data)\nprint(\"After access\")"
    - type: explanation
      content:
        text: 'The lazy property''s code runs only when you first access it—like cooking the meal only when you''re hungry. This saves resources if you never actually need the data.'
    - type: heading2
      content:
        text: Mini Challenge
    - type: explanation
      content:
        text: 'Create a struct with a lazy property that prints a message when loaded. Access it twice and notice that the message prints only once—showing lazy loading in action.'
    - type: heading2
      content:
        text: Reflection
    - type: explanation
      content:
        text: 'Why is it a good idea to hide implementation details with private? Think about how it helps keep your code safe and easier to change.'
  finalReview:
    content_blocks:
    - type: heading1
      content:
        text: Chapter 8 Review
    - type: explanation
      content:
        text: 'You''ve learned to handle missing data safely with optionals, ask "what costume are you wearing?" with typecasting, control who gets in with access control, and save energy with lazy properties.'
    - type: explanation
      content:
        text: 'Rules of thumb: unwrap optionals safely, prefer as? over as!, expose only what needs to be public, and defer expensive work with lazy.'
    - type: heading2
      content:
        text: Reflection
    - type: explanation
      content:
        text: 'Which of these advanced tools do you see yourself using first in a project? Think about your current coding challenges and where these concepts might help.'
