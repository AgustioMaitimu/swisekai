chapters:
- chapterName: 'Chapter 5: Closures'
  modules:
  - id: 280D751B-F9C4-4052-BE4F-FD46C23BA055
    module_name: Intro to Closures
    module_number: 16
    multiple_choice:
    - question: Which symbols define a closure body?
      options:
      - '{}'
      - ()
      - '[]'
      - <>
      answer: '{}'
    - question: Which keyword separates parameters from the closure body?
      options:
      - in
      - to
      - ->
      - do
      answer: in
    - question: What can you do with closures?
      options:
      - Store them in variables
      - Pass them to functions
      - Execute them later
      - All of the above
      answer: All of the above
    content_blocks:
    - type: heading1
      content:
        text: Intro to Closures
    - type: explanation
      content:
        text: A closure is a chunk of executable code you can pass around like data—think
          of it as a tiny function that fits in your pocket.
    - type: heading2
      content:
        text: Basic closure
    - type: snippet
      content:
        code: 'let sayHello = { print("Hello!") }

          sayHello()  // prints Hello!'
    - type: explanation
      content:
        text: Curly braces hold the body. Here, sayHello stores behavior you can run
          later.
    - type: heading2
      content:
        text: Closure with parameters
    - type: snippet
      content:
        code: "let repeatLine: (String, Int) -> Void = { text, times in\n  for _ in\
          \ 0..<times { print(text) }\n}\nrepeatLine(\"Swift!\", 2)  // prints twice"
    - type: explanation
      content:
        text: Use (Type, Type) -> Return to describe the closure’s signature; in separates
          parameters from the body.
    - type: heading2
      content:
        text: Inline closure as argument
    - type: snippet
      content:
        code: 'func perform(action: () -> Void) { action() }

          perform { print("Running inline") }'
    - type: explanation
      content:
        text: You can pass a closure directly where a function expects one—great for
          callbacks.
    - type: explanation
      content:
        text: 'Tip: Start with explicit types, then simplify once you understand the
          shape of your closure.'
  - id: 0B2837E4-AB1D-4E81-AC67-8F3F62FD821B
    module_name: Capturing Values
    module_number: 17
    multiple_choice:
    - question: What does it mean that a closure captures values?
      options:
      - It copies external variables into its own context
      - It cannot access external variables
      - It deletes variables
      - It turns values into strings
      answer: It copies external variables into its own context
    - question: 'Each closure instance keeps:'
      options:
      - A shared global state
      - Its own captured state
      - No state
      - Only parameters
      answer: Its own captured state
    - question: Why can capturing be powerful?
      options:
      - It lets closures remember progress
      - It prevents functions from running
      - It removes values
      - It slows code
      answer: It lets closures remember progress
    content_blocks:
    - type: heading1
      content:
        text: Capturing Values
    - type: explanation
      content:
        text: Closures can remember values from their surrounding scope—like packing
          a small backpack with local variables.
    - type: heading2
      content:
        text: A counter that remembers
    - type: snippet
      content:
        code: "func makeCounter() -> () -> Int {\n  var count = 0\n  return {\n  \
          \  count += 1\n    return count\n  }\n}\nlet next = makeCounter()\nprint(next())\
          \  // 1\nprint(next())  // 2"
    - type: explanation
      content:
        text: count lives on inside the returned closure. Each call updates the same
          captured value.
    - type: heading2
      content:
        text: Multiple independent captures
    - type: snippet
      content:
        code: 'let c1 = makeCounter()

          let c2 = makeCounter()

          print(c1())  // 1

          print(c1())  // 2

          print(c2())  // 1'
    - type: explanation
      content:
        text: Each closure instance gets its own copy of captured state—perfect for
          isolated tasks.
    - type: heading2
      content:
        text: Avoid surprise captures
    - type: snippet
      content:
        code: 'var total = 0

          let addToTotal: (Int) -> Void = { value in total += value }

          addToTotal(5)

          print(total)  // 5'
    - type: explanation
      content:
        text: Be mindful when capturing external variables; document intent or pass
          values explicitly if it’s clearer.
  - id: 96215EA9-0778-42A6-AFAC-166F48A565D6
    module_name: Higher-Order Functions
    module_number: 18
    multiple_choice:
    - question: Which function transforms each element of a collection?
      options:
      - map
      - filter
      - reduce
      - sorted
      answer: map
    - question: Which function keeps only elements that pass a test?
      options:
      - filter
      - map
      - reduce
      - append
      answer: filter
    - question: Which function combines all elements into a single value?
      options:
      - reduce
      - map
      - filter
      - count
      answer: reduce
    content_blocks:
    - type: heading1
      content:
        text: Higher-Order Functions
    - type: explanation
      content:
        text: 'Swift’s arrays come with power tools that take closures: map, filter,
          and reduce—write less code, get more done.'
    - type: heading2
      content:
        text: 'map: transform each value'
    - type: snippet
      content:
        code: 'let numbers = [1,2,3]

          let doubled = numbers.map { $0 * 2 }

          print(doubled)  // [2, 4, 6]'
    - type: explanation
      content:
        text: map applies your closure to every element and returns a new array of
          results.
    - type: heading2
      content:
        text: 'filter: keep some values'
    - type: snippet
      content:
        code: 'let evens = numbers.filter { $0 % 2 == 0 }

          print(evens)  // [2]'
    - type: explanation
      content:
        text: filter keeps elements where your closure returns true.
    - type: heading2
      content:
        text: 'reduce: combine into one'
    - type: snippet
      content:
        code: 'let sum = numbers.reduce(0) { partial, next in partial + next }

          print(sum)  // 6'
    - type: explanation
      content:
        text: reduce walks through the array, carrying an accumulator you update each
          step.
    - type: explanation
      content:
        text: 'Tip: Start with readable closures, then shorten using $0 and implicit
          returns when comfortable.'
  finalReview:
    content_blocks:
    - type: heading1
      content:
        text: Chapter 5 Review
    - type: explanation
      content:
        text: You learned what closures are, how they capture values to remember state,
          and how to wield them with map, filter, and reduce.
    - type: explanation
      content:
        text: 'Rule of thumb: closures are great for callbacks and transformations—keep
          them clear, then optimize for brevity.'
