chapters:
- chapterName: 'Chapter 5: Closures'
  modules:
  - id: 280D751B-F9C4-4052-BE4F-FD46C23BA055
    module_name: Intro to Closures
    module_number: 16
    multiple_choice:
    - question: Which symbols define a closure body?
      options:
      - '{}'
      - ()
      - '[]'
      - <>
      answer: '{}'
    - question: Which keyword separates parameters from the closure body?
      options:
      - in
      - to
      - ->
      - do
      answer: in
    - question: What can you do with closures?
      options:
      - Store them in variables
      - Pass them to functions
      - Execute them later
      - All of the above
      answer: All of the above
    content_blocks:
    - type: heading1
      content:
        text: Intro to Closures
    - type: explanation
      content:
        text: 'Think of a closure as a tiny function you can carry in your pocket or a post-it note with instructions. It''s a chunk of code that you can pass around, store, and run whenever you want—like a mini-program you keep handy.'
    - type: heading2
      content:
        text: Basic closure
    - type: snippet
      content:
        code: 'let sayHello = { print("Hello!") }

sayHello()  // prints Hello!'
    - type: explanation
      content:
        text: 'Curly braces { } hold the body of the closure. Here, sayHello stores a little behavior you can run later—like keeping a note that says ''Say Hello!'' and reading it when you want.'
    - type: heading2
      content:
        text: Closure with parameters
    - type: snippet
      content:
        code: "let repeatLine: (String, Int) -> Void = { text, times in\n  for _ in 0..<times { print(text) }\n}\nrepeatLine(\"Swift!\", 2)  // prints twice"
    - type: explanation
      content:
        text: 'The ''in'' keyword is like a divider: everything before ''in'' is the setup (parameters), and everything after is the action (the closure body). This closure takes a string and a number, then repeats the string that many times—step-by-step instructions wrapped neatly.'
    - type: heading2
      content:
        text: Inline closure as argument
    - type: snippet
      content:
        code: 'func perform(action: () -> Void) { action() }

perform { print("Running inline") }'
    - type: explanation
      content:
        text: 'You can pass a closure directly where a function expects one—like handing over a quick note with instructions. This is perfect for callbacks or quick tasks.'
    - type: explanation
      content:
        text: 'Tip: Start with explicit types to understand the shape of your closure, then simplify once you feel confident.'
    - type: heading2
      content:
        text: Mini Challenge
    - type: explanation
      content:
        text: 'Try this: Write a closure that takes a name and prints ''Hello, <name>''. It''s a fun way to practice defining parameters and using ''in''!'
    - type: heading2
      content:
        text: Reflection
    - type: explanation
      content:
        text: 'Why do you think closures are useful? Imagine you want to save little instructions to use later—how could this help your code stay organized?'
  - id: 0B2837E4-AB1D-4E81-AC67-8F3F62FD821B
    module_name: Capturing Values
    module_number: 17
    multiple_choice:
    - question: What does it mean that a closure captures values?
      options:
      - It copies external variables into its own context
      - It cannot access external variables
      - It deletes variables
      - It turns values into strings
      answer: It copies external variables into its own context
    - question: 'Each closure instance keeps:'
      options:
      - A shared global state
      - Its own captured state
      - No state
      - Only parameters
      answer: Its own captured state
    - question: Why can capturing be powerful?
      options:
      - It lets closures remember progress
      - It prevents functions from running
      - It removes values
      - It slows code
      answer: It lets closures remember progress
    content_blocks:
    - type: heading1
      content:
        text: Capturing Values
    - type: explanation
      content:
        text: 'Imagine closures carry a backpack filled with variables from their environment. They don''t just run code—they remember the stuff around them, like packing snacks for a trip.'
    - type: heading2
      content:
        text: A counter that remembers
    - type: snippet
      content:
        code: "func makeCounter() -> () -> Int {\n  var count = 0\n  return {\n    count += 1\n    return count\n  }\n}\nlet next = makeCounter()\nprint(next())  // 1\nprint(next())  // 2"
    - type: explanation
      content:
        text: 'Here, the closure keeps count inside its backpack. Each time you call it, count updates and stays with the closure—it remembers where it left off.'
    - type: heading2
      content:
        text: Multiple independent captures
    - type: snippet
      content:
        code: 'let c1 = makeCounter()

let c2 = makeCounter()

print(c1())  // 1

print(c1())  // 2

print(c2())  // 1'
    - type: explanation
      content:
        text: 'Each closure has its own backpack—c1 and c2 don''t share their counts. This means you can have multiple counters running independently, each with their own memory.'
    - type: heading2
      content:
        text: Avoid surprise captures
    - type: snippet
      content:
        code: 'var total = 0

let addToTotal: (Int) -> Void = { value in total += value }

addToTotal(5)

print(total)  // 5'
    - type: explanation
      content:
        text: 'Be mindful when your closure captures external variables; it''s like sharing snacks from your backpack. Sometimes you want to be explicit or pass values directly to avoid surprises.'
    - type: heading2
      content:
        text: Mini Challenge
    - type: explanation
      content:
        text: 'Make two counters with makeCounter() and show they count independently. Call each counter a few times and print their results to see their separate backpacks in action!'
    - type: heading2
      content:
        text: Reflection
    - type: explanation
      content:
        text: 'Think about real apps—when would capturing values be useful? Maybe remembering user progress or settings? How does this help create smarter, stateful functions?'
  - id: 96215EA9-0778-42A6-AFAC-166F48A565D6
    module_name: Higher-Order Functions
    module_number: 18
    multiple_choice:
    - question: Which function transforms each element of a collection?
      options:
      - map
      - filter
      - reduce
      - sorted
      answer: map
    - question: Which function keeps only elements that pass a test?
      options:
      - filter
      - map
      - reduce
      - append
      answer: filter
    - question: Which function combines all elements into a single value?
      options:
      - reduce
      - map
      - filter
      - count
      answer: reduce
    content_blocks:
    - type: heading1
      content:
        text: Higher-Order Functions
    - type: explanation
      content:
        text: 'Swift''s arrays come with powerful tools that love closures: map, filter, and reduce. Think of them as a factory line where you can transform, select, and combine items with ease.'
    - type: heading2
      content:
        text: 'map: transform each value'
    - type: snippet
      content:
        code: 'let numbers = [1,2,3]

let doubled = numbers.map { $0 * 2 }

print(doubled)  // [2, 4, 6]'
    - type: explanation
      content:
        text: 'map is like a factory line that changes each item—it takes every number and doubles it, producing a new array with the transformed results.'
    - type: heading2
      content:
        text: 'filter: keep some values'
    - type: snippet
      content:
        code: 'let evens = numbers.filter { $0 % 2 == 0 }

print(evens)  // [2]'
    - type: explanation
      content:
        text: 'filter acts like a fruit picker, keeping only the ripe fruits—elements that pass your test stay, others get left behind.'
    - type: heading2
      content:
        text: 'reduce: combine into one'
    - type: snippet
      content:
        code: 'let sum = numbers.reduce(0) { partial, next in partial + next }

print(sum)  // 6'
    - type: explanation
      content:
        text: 'reduce squeezes all the fruits into one juice—it combines all elements into a single value by accumulating step-by-step.'
    - type: explanation
      content:
        text: 'Tip: Start with clear, readable closures, then shorten them using $0 and implicit returns as you get comfortable.'
    - type: heading2
      content:
        text: Mini Challenge
    - type: explanation
      content:
        text: 'Try this: Use filter to get numbers greater than 5, then map them to double their values. It''s a great way to practice chaining these powerful tools!'
    - type: heading2
      content:
        text: Reflection
    - type: explanation
      content:
        text: 'Which of map, filter, or reduce feels most natural to you and why? Think about how each fits your way of thinking about data.'
  finalReview:
    content_blocks:
    - type: heading1
      content:
        text: Chapter 5 Review
    - type: explanation
      content:
        text: 'You''ve learned that closures are like portable functions you can carry and use anywhere, capturing values is like giving closures a backpack to remember state, and higher-order functions are your power tools for working with collections efficiently.'
    - type: explanation
      content:
        text: 'Rule of thumb: closures make your code flexible and expressive. Use capturing to manage state smartly, and harness map, filter, and reduce to write cleaner, more powerful code.'
    - type: heading2
      content:
        text: Reflection
    - type: explanation
      content:
        text: 'Where do you imagine using closures first—UI callbacks, data transformations, or something else? Think about your projects and how these tools can make your code shine!'
