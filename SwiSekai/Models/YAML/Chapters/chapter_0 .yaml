chapters:
  - chapterName: "Chapter 0: Getting Started"
    modules:
      - id: "B1E7A8D6-1C4B-4E9F-A2D9-6C8E4B5A1F2C"
        module_name: "Creating Your First Playground"
        module_number: 1
        multiple_choice:
          - question: "Before creating a Swift Playground, what essential application must be installed from the Mac App Store?"
            options:
              - "Swift Playgrounds"
              - "Xcode"
              - "Visual Studio Code"
              - "Sublime Text"
            answer: "Xcode"
          - question: "In Xcode, what is the menu path to start creating a new Playground?"
            options:
              - "File > New > Project..."
              - "Edit > Create > Playground..."
              - "File > New > Playground..."
              - "Window > New > Playground..."
            answer: "File > New > Playground..."
          - question: "When creating a new Playground, which template provides a clean slate for writing code?"
            options:
              - "Game"
              - "Map"
              - "Single View App"
              - "Blank"
            answer: "Blank"
        content_blocks:
          - type: "heading1"
            content:
              text: "Creating Your First Swift Playground"
          - type: "explanation"
            content:
              text: "Hey there, coder! Imagine a magical sandbox where your Swift code comes to life instantly – that's a Swift Playground! It's your personal playground to experiment, learn, and have a blast without the fuss of building a full app. Ready to jump in? Let's create your first playground! 🚀"
          - type: "heading2"
            content:
              text: "Step 1: Grab Xcode"
          - type: "explanation"
            content:
              text: "To get started, you need Xcode – Apple's epic toolkit for crafting apps. It’s free, powerful, and your ticket to Swift stardom. Think of it as your coding superpower!"
          - type: "explanation"
            content:
              text: "1. Open the **App Store** on your Mac. \n2. Search for `Xcode` and hit Enter – it’ll pop up like magic. \n3. Click **Get** (it flips to **Install**), and you might need your Apple ID password. \n4. It’s a big download, so maybe grab a coffee. Once done, find Xcode in your **Applications** folder, launch it, and agree to any extra setup prompts. You’re almost coding!"
          - type: "heading2"
            content:
              text: "Step 2: Start a New Playground"
          - type: "explanation"
            content:
              text: "With Xcode open, let’s make a playground. Head to the top menu and follow this path:"
          - type: "snippet"
            content:
              code: "File > New > Playground..."
          - type: "explanation"
            content:
              text: "A window will ask for a template. Go to the **iOS** tab and pick **Blank** – it’s like a blank canvas for your coding masterpieces."
          - type: "heading2"
            content:
              text: "Step 3: Name and Save It"
          - type: "explanation"
            content:
              text: "Click **Next**, name your playground something fun like `MyFirstPlayground`, and pick a save spot (Desktop’s handy). Hit **Create**, and voilà – your playground is ready to roll!"

      - id: "C2F8B9E7-2D5C-4F0A-B3E0-7D9F5C6B2A3D"
        module_name: "Exploring the Playground Interface"
        module_number: 2
        multiple_choice:
          - question: "In the Playground interface, what is the main area where you write your Swift code?"
            options:
              - "Results Sidebar"
              - "Debug Area"
              - "Code Editor"
              - "Console"
            answer: "Code Editor"
          - question: "Which part of the interface provides instant feedback by showing the value of each line of code as it runs?"
            options:
              - "The Console"
              - "The Code Editor"
              - "The Menu Bar"
              - "The Results Sidebar"
            answer: "The Results Sidebar"
          - question: "Where would you look to see the output from `print()` statements and any error messages?"
            options:
              - "The Results Sidebar"
              - "The Debug Area / Console"
              - "A new pop-up window"
              - "The top of the Code Editor"
            answer: "The Debug Area / Console"
        content_blocks:
          - type: "heading1"
            content:
              text: "Exploring the Playground Interface"
          - type: "explanation"
            content:
              text: "Your playground’s open – sweet! Let’s take a quick tour so you can navigate like a pro. Knowing the layout is like knowing your way around a new game – it makes everything more fun."
          - type: "heading2"
            content:
              text: "The Key Areas"
          - type: "explanation"
            content:
              text: "Your screen’s like a coder’s dashboard:\n\n1. **Code Editor**: The big left area – your stage for writing Swift code.\n\n2. **Results Sidebar**: On the right, this shows what each line does as it runs, like a live report card.\n\n3. **Debug Area / Console**: At the bottom, it’s where `print()` messages and any error notes pop up.\n\n4. **Execution Controls**: Spot the blue 'play' button at the bottom of the Code Editor? That’s your ‘go’ button to run your code."
          - type: "heading2"
            content:
              text: "Customizing Your Space"
          - type: "explanation"
            content:
              text: "Want to tweak the view? Use the buttons in the top-right corner to show or hide panels like the Debug Area. Make it feel like your own coding hideout!"

      - id: "D3A9C0F8-3E6D-4A1B-C4F1-8E0A6D7C3B4E"
        module_name: "Writing and Running Code"
        module_number: 3
        multiple_choice:
          - question: "What does the line `let greeting = \"Hello\"` do?"
            options:
              - "It prints \"Hello\" to the console."
              - "It creates a variable named `greeting`."
              - "It creates a constant named `greeting` holding the text \"Hello\"."
              - "It causes an error."
            answer: "It creates a constant named `greeting` holding the text \"Hello\"."
          - question: "After running `let message = \"Welcome\"`, where would you see `\"Welcome\"` appear?"
            options:
              - "Only in the Debug Area"
              - "Nowhere, unless you print it"
              - "In the Results Sidebar, next to the line of code"
              - "In the menu bar"
            answer: "In the Results Sidebar, next to the line of code"
          - question: "What is the result of running `print(\"Swift is fun!\")` in a Playground?"
            options:
              - "The text `Swift is fun!` appears in the Results Sidebar."
              - "The text `\"Swift is fun!\"` appears in the Code Editor."
              - "The text `Swift is fun!` appears in the Debug Area / Console."
              - "The code creates a new constant."
            answer: "The text `Swift is fun!` appears in the Debug Area / Console."
        content_blocks:
          - type: "heading1"
            content:
              text: "Writing and Running Your First Code"
          - type: "explanation"
            content:
              text: "Here’s where the fun starts! Let’s write some code and see it work its magic. Your playground might have some starter code – feel free to clear it out and make it your own."
          - type: "heading2"
            content:
              text: "Step 1: Write Some Code"
          - type: "explanation"
            content:
              text: "In the Code Editor, type this to store a friendly message in a constant – like slipping a note into a jar:"
          - type: "snippet"
            content:
              code: |
                let greeting = "Hello, Playground! 👋"
          - type: "heading2"
            content:
              text: "Step 2: Hit Run"
          - type: "explanation"
            content:
              text: "Find the blue **Run** button below the line numbers in the editor. Click it, and watch your code come to life!"
          - type: "heading2"
            content:
              text: "Step 3: Check the Results"
          - type: "explanation"
            content:
              text: "Look at the **Results Sidebar** on the right. You’ll see `\"Hello, Playground! 👋\"` next to your code – it’s like your playground cheering you on!"
          - type: "heading2"
            content:
              text: "Step 4: Shout It Out with Print"
          - type: "explanation"
            content:
              text: "Add this line below to broadcast your message to the console:"
          - type: "snippet"
            content:
              code: |
                print(greeting)
          - type: "explanation"
            content:
              text: "Run it again, and peek at the **Debug Area** below. There’s your message: `Hello, Playground! 👋`. It’s like sending a postcard from your code!"

    finalReview:
      content_blocks:
        - type: "heading1"
          content:
            text: "Chapter 0 Review"
        - type: "explanation"
          content:
            text: "You did it! You’ve set up your coding playground and dipped your toes into Swift. It’s like opening the door to a whole new world of creativity. Let’s recap your awesome start."
        - type: "heading2"
          content:
            text: "Your New Superpowers"
        - type: "explanation"
          content:
            text: "**Xcode Setup:** You tracked down and installed Xcode like a pro. This is the same tool Apple developers use – you’re in the big leagues!"
        - type: "explanation"
          content:
            text: "**Playground Creation:** You built a Swift Playground from scratch – your own space to experiment and play with code."
        - type: "explanation"
          content:
            text: "**Interface Navigation:** You’re comfy with the playground’s layout: the **Code Editor** for typing, **Results Sidebar** for instant feedback, and **Debug Area** for messages and errors."
        - type: "explanation"
          content:
            text: "**Coding and Running:** You wrote your first Swift lines with `let` and `print()`, ran them, and saw the results. You’re officially a coder now!"