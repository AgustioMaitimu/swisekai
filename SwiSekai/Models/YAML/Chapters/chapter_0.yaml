chapters:
- chapterName: 'Chapter 0: Getting Started'
  modules:
  - id: 2398C0CA-60F8-49DF-A0FB-008536F32A94
    module_name: Creating Your First Playground
    module_number: 1
    multiple_choice:
    - question: Before creating a Swift Playground, what essential application must
        be installed from the Mac App Store?
      options:
      - Swift Playgrounds
      - Xcode
      - Visual Studio Code
      - Sublime Text
      answer: Xcode
    - question: In Xcode, what is the menu path to start creating a new Playground?
      options:
      - File > New > Project...
      - Edit > Create > Playground...
      - File > New > Playground...
      - Window > New > Playground...
      answer: File > New > Playground...
    - question: When creating a new Playground, which template provides a clean slate
        for writing code?
      options:
      - Game
      - Map
      - Single View App
      - Blank
      answer: Blank
    content_blocks:
    - type: heading1
      content:
        text: 'Creating Your First Swift Playground'
    - type: explanation
      content:
        text: 'Think of a Swift Playground as your personal sandbox—a safe, fun place where you can experiment with code without worrying about breaking anything. It’s like having a magic notebook that instantly shows what your code does, so you can learn by playing around.'
    - type: heading2
      content:
        text: 'Step 1: Install Xcode – Your Coding Toolbox'
    - type: explanation
      content:
        text: 'Open the Mac App Store, search for Xcode, and install it. Xcode is the all-in-one toolkit that Apple provides for writing Swift and building apps. When you open it for the first time, it might ask to install extra components—just click “Allow.” This sets up everything you need behind the scenes.'
    - type: heading2
      content:
        text: 'Step 2: Create a Playground – Your Coding Sandbox'
    - type: explanation
      content:
        text: 'In Xcode’s menu bar at the top, click File > New > Playground... This starts a new playground where you can write Swift code. Think of this as opening a fresh sketchbook for your ideas.'
    - type: snippet
      content:
        code: File > New > Playground...
    - type: explanation
      content:
        text: 'Next, pick the iOS tab and select the Blank template. This gives you a clean slate to start coding without distractions.'
    - type: heading2
      content:
        text: 'Step 3: Name and Save – Make It Yours'
    - type: explanation
      content:
        text: 'Give your playground a friendly name like MyFirstPlayground. You can even get creative—how about SwiftQuest? Choose a folder you’ll remember, then save it. Don’t worry, you’re not making anything permanent yet—this is just your playground to explore.'
    - type: heading2
      content:
        text: 'Quick Challenge: Customize Your Playground Name'
    - type: explanation
      content:
        text: 'Try changing the name of your playground to something fun, like SwiftQuest, and save it again. This helps you get comfortable with Xcode’s interface and makes your coding space feel personal.'
  - id: D768DDD4-842D-4CDC-BD14-FFA54EA76AC1
    module_name: Exploring the Playground Interface
    module_number: 2
    multiple_choice:
    - question: In the Playground interface, what is the main area where you write
        your Swift code?
      options:
      - Results Sidebar
      - Debug Area
      - Code Editor
      - Console
      answer: Code Editor
    - question: Which part of the interface provides instant feedback by showing the
        value of each line of code as it runs?
      options:
      - The Console
      - The Code Editor
      - The Menu Bar
      - The Results Sidebar
      answer: The Results Sidebar
    - question: Where would you look to see the output from print() statements and
        any error messages?
      options:
      - The Results Sidebar
      - The Debug Area / Console
      - A new pop‑up window
      - The top of the Code Editor
      answer: The Debug Area / Console
    content_blocks:
    - type: heading1
      content:
        text: 'Exploring the Playground Interface'
    - type: explanation
      content:
        text: 'Imagine your playground is like a cozy studio where you create and see your work come alive. Let’s meet the key areas:'
    - type: heading2
      content:
        text: 'Your Coding Studio: The Key Areas'
    - type: explanation
      content:
        text: |
          - **Code Editor:** This is your notebook where you write Swift code. It’s the big blank space on the left where your ideas take shape.
          
          - **Results Sidebar:** Think of this as your sticky note helper on the right. It shows the value or result of each line of code as soon as it runs, so you get instant feedback.
          
          - **Debug Area (Console):** This is your loudspeaker at the bottom. It shows messages from your code (like print statements) and error messages. Don’t worry if you see errors—they’re like helpful hints telling you what to fix, and everyone encounters them when learning.
    - type: heading2
      content:
        text: 'Tidy Your Space'
    - type: explanation
      content:
        text: 'Use the view buttons at the top-right corner of Xcode to show or hide these panes. Keeping your workspace organized helps you focus on what matters.'
    - type: heading2
      content:
        text: 'Reflection Challenge: Try This!'
    - type: explanation
      content:
        text: 'In the Code Editor, type this line exactly and then press the Run ▶︎ button. Look down at the Console (Debug Area) — did your message appear? This is your computer talking back to you!'
    - type: snippet
      content:
        code: print("I'm learning Swift!")
  - id: 33FCF334-F3B1-4801-B83C-C1F1F669ADAE
    module_name: Writing and Running Code
    module_number: 3
    multiple_choice:
    - question: What does the line let greeting = "Hello" do?
      options:
      - It prints to the console.
      - It creates a variable named greeting.
      - It creates a constant named greeting holding the text "Hello".
      - It causes an error.
      answer: It creates a constant named greeting holding the text "Hello".
    - question: After running let message = "Welcome", where might you see "Welcome"
        appear automatically in a playground?
      options:
      - Only in the Debug Area
      - Nowhere unless you print it
      - In the Results Sidebar next to that line
      - In the menu bar
      answer: In the Results Sidebar next to that line
    - question: What is the result of running print("Swift is fun!") in a Playground?
      options:
      - Shows in the Results Sidebar
      - Shows in the Code Editor
      - Shows in the Debug Area / Console
      - Creates a new constant
      answer: Shows in the Debug Area / Console
    content_blocks:
    - type: heading1
      content:
        text: 'Writing and Running Your First Code'
    - type: explanation
      content:
        text: 'This is your first conversation with the computer! Let’s break down the line `let greeting = \"Hello\"` so you know exactly what’s happening.'
    - type: heading2
      content:
        text: 'Step 1: Understand the Code'
    - type: explanation
      content:
        text: |
          - `let` is a keyword that tells Swift you’re creating a constant—a value that won’t change.
          - `greeting` is the name you’re giving this constant. Think of it as a label on a jar.
          - `"Hello"` is the value inside the jar, the actual text you want to store.
          
          So this line says: “Create a jar named greeting and put the word Hello inside.”
    - type: heading2
      content:
        text: 'Step 2: Run Your Code'
    - type: explanation
      content:
        text: 'Press the Run ▶︎ button. Swift will process your code, and you’ll see the word Hello appear in the Results Sidebar next to your line. This instant feedback helps you know what your code is doing.'
    - type: heading2
      content:
        text: 'Step 3: Print to the Console – Talk to Your Computer'
    - type: explanation
      content:
        text: 'When you want your program to speak out loud, you use `print()`. For example, type `print(greeting)` and run it. Your message will show up in the Console (the Debug Area at the bottom). It’s like your computer saying hello back!'
    - type: snippet
      content:
        code: print(greeting)
    - type: explanation
      content:
        text: 'Run it again and watch your message appear in the Console. This is exciting—your code is alive!'
    - type: heading2
      content:
        text: 'Mini Challenge: Make It Personal'
    - type: explanation
      content:
        text: 'Change the message inside the quotes to your own name, like `let greeting = \"Hi, I''m [Your Name]!\"` then run your playground again. See your personalized greeting appear? You’re coding magic!'
  finalReview:
    content_blocks:
    - type: heading1
      content:
        text: 'Chapter 0 Review'
    - type: explanation
      content:
        text: 'Congratulations! You didn’t just set up tools—you started your Swift journey. You created a playground, explored the interface, wrote your first lines of code, and saw your computer respond. That’s a huge step forward!'
    - type: heading2
      content:
        text: 'What You’ve Learned'
    - type: explanation
      content:
        text: |
          • How to install and open Xcode, your coding toolbox
          
          • How to create and save a Playground—a safe place to experiment
          
          • The roles of the Code Editor, Results Sidebar, and Console
          
          • How to write simple Swift code and see instant feedback
    - type: heading2
      content:
        text: 'Reflection Question'
    - type: explanation
      content:
        text: 'What was the most surprising thing you saw today—the instant feedback in the Results Sidebar, the messages in the Console, or something else? Take a moment to celebrate your progress and get ready for the next exciting chapter!'
