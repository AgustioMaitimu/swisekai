chapters:
- chapterName: 'Chapter 2: Collections'
  modules:
  - id: 1FBBBD10-F753-4863-A963-F61A53E4EB66
    module_name: Arrays
    module_number: 7
    multiple_choice:
    - question: How do you access the first element of an array?
      options:
      - array(1)
      - array[0]
      - first(array)
      - array.first()
      answer: array[0]
    - question: Which property gives the total number of items in an array?
      options:
      - .length
      - .count
      - .size
      - .items
      answer: .count
    - question: 'Arrays in Swift are:'
      options:
      - Ordered
      - Unordered
      - Key-Value
      - Immutable only
      answer: Ordered
    content_blocks:
    - type: heading1
      content:
        text: Arrays
    - type: explanation
      content:
        text: An array is like a row of lockers—each item has an index starting at
          0. They’re great for storing ordered lists of values.
    - type: heading2
      content:
        text: Creating arrays
    - type: snippet
      content:
        code: 'var fruits = ["Apple", "Banana", "Cherry"]

          print(fruits[0])  // Apple'
    - type: explanation
      content:
        text: Square brackets [] hold multiple values. Use index numbers to access
          them.
    - type: heading2
      content:
        text: Array properties
    - type: snippet
      content:
        code: 'print(fruits.count)   // 3

          print(fruits.isEmpty) // false'
    - type: explanation
      content:
        text: Use .count to know how many items, .isEmpty to check if it’s empty.
    - type: heading2
      content:
        text: Adding & removing
    - type: snippet
      content:
        code: 'fruits.append("Mango")

          fruits.remove(at: 1)

          print(fruits) // [Apple, Cherry, Mango]'
    - type: explanation
      content:
        text: append adds to the end, remove(at:) deletes by index.
    - type: explanation
      content:
        text: 'Tip: Arrays keep order. Great for sequences, tasks, or playlists.'
  - id: E6953028-F269-40A3-A481-C648F69FEBD4
    module_name: Dictionaries & Sets
    module_number: 8
    multiple_choice:
    - question: 'Dictionaries store values as:'
      options:
      - Index-Value
      - Key-Value
      - Ordered List
      - Unique Only
      answer: Key-Value
    - question: 'Sets automatically:'
      options:
      - Allow duplicates
      - Remove duplicates
      - Keep order
      - Require indexes
      answer: Remove duplicates
    - question: How do you read the value for key "Sam"?
      options:
      - dict.Sam
      - dict[Sam]
      - dict["Sam"]
      - dict->Sam
      answer: dict["Sam"]
    content_blocks:
    - type: heading1
      content:
        text: Dictionaries & Sets
    - type: explanation
      content:
        text: Dictionaries are like labeled jars—each key points to a value. Sets
          are bags of unique items—no duplicates allowed.
    - type: heading2
      content:
        text: Dictionaries
    - type: snippet
      content:
        code: 'var ages = ["Sam": 20, "Kim": 22]

          print(ages["Sam"])  // Optional(20)'
    - type: explanation
      content:
        text: Dictionaries pair keys with values. Keys must be unique.
    - type: heading2
      content:
        text: Updating dictionaries
    - type: snippet
      content:
        code: 'ages["Alex"] = 25

          ages["Sam"] = 21'
    - type: explanation
      content:
        text: You can add or update values by key.
    - type: heading2
      content:
        text: Sets
    - type: snippet
      content:
        code: 'var colors: Set = ["Red", "Blue", "Green", "Red"]

          print(colors)  // [Red, Blue, Green]'
    - type: explanation
      content:
        text: Sets remove duplicates automatically and don’t guarantee order.
    - type: explanation
      content:
        text: 'Tip: Use dictionaries for labeled data, sets for uniqueness tests.'
  - id: 6CEE41C2-A58E-4C2D-8270-9C4AF86614FB
    module_name: Enums
    module_number: 9
    multiple_choice:
    - question: Which keyword defines an enum?
      options:
      - enum
      - struct
      - class
      - case
      answer: enum
    - question: How do you reference case east?
      options:
      - east
      - Direction.east
      - Direction->east
      - case east
      answer: Direction.east
    - question: 'Enums help prevent:'
      options:
      - Typos
      - Options
      - Safety
      - Values
      answer: Typos
    content_blocks:
    - type: heading1
      content:
        text: Enums
    - type: explanation
      content:
        text: Enums (short for enumerations) define a group of related values—like
          fixed menu options.
    - type: heading2
      content:
        text: Basic enum
    - type: snippet
      content:
        code: 'enum Direction { case north, south, east, west }

          var move = Direction.north'
    - type: explanation
      content:
        text: You declare all possible cases. Variables can only be set to one of
          them.
    - type: heading2
      content:
        text: Switch with enums
    - type: snippet
      content:
        code: 'switch move {

          case .north: print("Up")

          case .south: print("Down")

          case .east: print("Right")

          case .west: print("Left")

          }'
    - type: explanation
      content:
        text: Switch ensures you cover all cases—no forgotten branches.
    - type: heading2
      content:
        text: Associated values
    - type: snippet
      content:
        code: 'enum Result { case success(data: String), failure(error: String) }

          let output = Result.success(data: "File loaded")'
    - type: explanation
      content:
        text: Cases can store extra data—making enums flexible and safe.
    - type: explanation
      content:
        text: 'Tip: Use enums when choices are known and finite.'
  finalReview:
    content_blocks:
    - type: heading1
      content:
        text: Chapter 2 Review
    - type: explanation
      content:
        text: You explored arrays for ordered lists, dictionaries for key-value pairs,
          sets for unique collections, and enums for fixed choices.
    - type: explanation
      content:
        text: 'Rule of thumb: arrays for order, dictionaries for labels, sets for
          uniqueness, enums for safe predefined options.'
