chapters:
- chapterName: 'Chapter 2: Collections'
  modules:
  - id: 1FBBBD10-F753-4863-A963-F61A53E4EB66
    module_name: Arrays
    module_number: 7
    multiple_choice:
    - question: How do you access the first element of an array?
      options:
      - array(1)
      - array[0]
      - first(array)
      - array.first()
      answer: array[0]
    - question: Which property gives the total number of items in an array?
      options:
      - .length
      - .count
      - .size
      - .items
      answer: .count
    - question: 'Arrays in Swift are:'
      options:
      - Ordered
      - Unordered
      - Key-Value
      - Immutable only
      answer: Ordered
    content_blocks:
    - type: heading1
      content:
        text: Arrays
    - type: explanation
      content:
        text: 'Imagine an array as a bookshelf or a playlist: each spot holds a book or a song, and every spot has a number (its "index"). In Swift, arrays help you keep your items in order—like lining up your favorite games or movies. Remember: arrays start counting at zero! So the first item is at index 0, the second at 1, and so on. Arrays are perfect for keeping track of to-do lists, collections, or any sequence where order matters.'
    - type: heading2
      content:
        text: Creating arrays
    - type: snippet
      content:
        code: 'var fruits = ["Apple", "Banana", "Cherry"]

print(fruits[0])  // Apple'
    - type: explanation
      content:
        text: 'The square brackets ''[]'' are your array container, holding each value in order. To get an item, use its index in the brackets. For example, ''fruits[0]'' gives you the first fruit, ''Apple''. Remember: the first spot is 0, not 1!'
    - type: explanation
      content:
        text: 'Mini Challenge: Create your own array of 3 favorite movies and print the last one. Hint: Use the index 2 for the third movie!'
    - type: heading2
      content:
        text: Array properties
    - type: snippet
      content:
        code: 'print(fruits.count)   // 3

print(fruits.isEmpty) // false'
    - type: explanation
      content:
        text: 'Use ''.count'' to see how many items are on your ''bookshelf''. ''.isEmpty'' checks if your array has nothing inside—like an empty playlist!'
    - type: heading2
      content:
        text: Adding & removing
    - type: snippet
      content:
        code: 'fruits.append("Mango")

fruits.remove(at: 1)

print(fruits) // [Apple, Cherry, Mango]'
    - type: explanation
      content:
        text: 'Use ''.append'' to add something new at the end of your array—like adding a book to the last shelf. ''.remove(at: index)'' takes out an item at a specific spot (remember, counting starts at 0).'
    - type: explanation
      content:
        text: 'Tip: Arrays always remember the order of your items. Think of them as your go-to for making lists, playlists, or step-by-step instructions.'
    - type: explanation
      content:
        text: 'Practice Exercise: Try changing the array so the last fruit is your favorite. How does the order change?'
  - id: E6953028-F269-40A3-A481-C648F69FEBD4
    module_name: Dictionaries & Sets
    module_number: 8
    multiple_choice:
    - question: 'Dictionaries store values as:'
      options:
      - Index-Value
      - Key-Value
      - Ordered List
      - Unique Only
      answer: Key-Value
    - question: 'Sets automatically:'
      options:
      - Allow duplicates
      - Remove duplicates
      - Keep order
      - Require indexes
      answer: Remove duplicates
    - question: How do you read the value for key "Sam"?
      options:
      - dict.Sam
      - dict[Sam]
      - dict["Sam"]
      - dict->Sam
      answer: dict["Sam"]
    content_blocks:
    - type: heading1
      content:
        text: Dictionaries & Sets
    - type: explanation
      content:
        text: 'Dictionaries and sets are two special ways to organize information. Imagine a dictionary as a shelf of labeled jars, where each jar (the key) has a label and holds something inside (the value)—like a phonebook where a name leads you to a number! Sets, on the other hand, are like a bag of unique stickers: you can toss in as many as you want, but if you try to add a duplicate, it just ignores it. Sets never care about order, only about uniqueness!'
    - type: heading2
      content:
        text: Dictionaries
    - type: snippet
      content:
        code: 'var ages = ["Sam": 20, "Kim": 22]

print(ages["Sam"])  // Optional(20)'
    - type: explanation
      content:
        text: 'In a dictionary, every key (like a person''s name) is unique and points to a value (like their age). Think of it as a contact list: you look up ''Sam'' and see ''20''. Notice how the output says ''Optional(20)''? That''s because Swift checks if the key exists—it''s like asking, "Is there a jar labeled Sam?"'
    - type: explanation
      content:
        text: 'Mini Challenge: Add a new friend to the ''ages'' dictionary (choose any name and age), then print their age to see how it appears!'
    - type: heading2
      content:
        text: Updating dictionaries
    - type: snippet
      content:
        code: 'ages["Alex"] = 25

ages["Sam"] = 21'
    - type: explanation
      content:
        text: 'You can add a new label (key) or update what''s inside a jar (value) just by assigning with the key. If the key exists, you update; if not, you create a new entry!'
    - type: heading2
      content:
        text: Sets
    - type: snippet
      content:
        code: 'var animals: Set = ["Cat", "Dog", "Bird", "Cat"]

print(animals)  // ["Cat", "Dog", "Bird"] (order may vary)'
    - type: explanation
      content:
        text: 'Sets are like a bag of unique stickers: if you add "Cat" twice, you''ll still only have one "Cat" sticker. Sets ignore duplicates and don''t care about order—when you dump out the bag, the stickers could come out in any sequence!'
    - type: explanation
      content:
        text: 'Mini Challenge: Create a set of animals with some duplicates. Print it and see how Swift keeps only unique entries!'
    - type: explanation
      content:
        text: 'Tip: Use dictionaries when you need labels (like phone contacts), and sets when you want to make sure everything is unique (like collecting rare trading cards).'
  - id: 6CEE41C2-A58E-4C2D-8270-9C4AF86614FB
    module_name: Enums
    module_number: 9
    multiple_choice:
    - question: Which keyword defines an enum?
      options:
      - enum
      - struct
      - class
      - case
      answer: enum
    - question: How do you reference case east?
      options:
      - east
      - Direction.east
      - Direction->east
      - case east
      answer: Direction.east
    - question: 'Enums help prevent:'
      options:
      - Typos
      - Options
      - Safety
      - Values
      answer: Typos
    content_blocks:
    - type: heading1
      content:
        text: Enums
    - type: explanation
      content:
        text: 'Enums (short for ''enumerations'') are like multiple-choice questions: you define all the possible answers ahead of time, and your code can only pick from those. Imagine you have a menu with four fixed options—no typos, no surprises. Enums make your code safer and clearer!'
    - type: heading2
      content:
        text: Basic enum
    - type: snippet
      content:
        code: 'enum Direction { case north, south, east, west }

var move = Direction.north'
    - type: explanation
      content:
        text: 'You list all the possible cases (choices) up front. Variables can only be set to one of these—like picking your answer from a set of buttons!'
    - type: explanation
      content:
        text: 'Mini Challenge: Make an enum for the days of the week, then create a variable for today and print it. Example: enum Day { case monday, tuesday, ... }'
    - type: heading2
      content:
        text: Switch with enums
    - type: snippet
      content:
        code: 'switch move {
case .north: print("Up")
case .south: print("Down")
case .east: print("Right")
case .west: print("Left")
}'
    - type: explanation
      content:
        text: 'A switch statement with an enum is like a teacher making sure you answered every question. Swift won''t let you forget a case, so your code is safer and less buggy!'
    - type: heading2
      content:
        text: Associated values
    - type: snippet
      content:
        code: 'enum Result { case success(data: String), failure(error: String) }

let output = Result.success(data: "File loaded")'
    - type: explanation
      content:
        text: 'Enums can hold extra information for each case—like a multiple-choice answer that also lets you write a note. This makes your code flexible and still safe!'
    - type: explanation
      content:
        text: 'Tip: Use enums when you have a fixed list of options, like days of the week or menu choices.'
    - type: explanation
      content:
        text: 'Reflection: Why is using enums safer than just writing strings? Think about how enums catch typos and limit you to valid choices—no more "Tusday" instead of "Tuesday"!'
  finalReview:
    content_blocks:
    - type: heading1
      content:
        text: Chapter 2 Review
    - type: explanation
      content:
        text: 'Wow! You''ve just mastered the four most important ways to organize information in Swift. Arrays let you line up items in order, dictionaries help you label and look up values, sets keep only the unique treasures, and enums give you safe, fixed choices. These are your toolbox for building real apps!'
    - type: explanation
      content:
        text: 'Rule of thumb: arrays for order (like playlists), dictionaries for labels (like contacts), sets for uniqueness (like rare cards), and enums for safe, predefined options (like days of the week).'
    - type: explanation
      content:
        text: 'Reflection: Which collection type—arrays, dictionaries, sets, or enums—do you see yourself using first in a real project? Why? Take a moment to imagine your next app idea!'
