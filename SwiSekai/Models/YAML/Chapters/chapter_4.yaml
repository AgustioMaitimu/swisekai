chapters:
- chapterName: 'Chapter 4: Functions & Errors'
  modules:
  - id: 797D9ED5-51AC-40FB-9063-9810E4C972FB
    module_name: Functions
    module_number: 13
    multiple_choice:
    - question: Which keyword starts a function in Swift?
      options:
      - func
      - function
      - def
      - fn
      answer: func
    - question: What symbol introduces the return type?
      options:
      - ->
      - ':'
      - =>
      - returns
      answer: ->
    - question: What is a good reason to use a function?
      options:
      - To repeat code everywhere
      - To group reusable logic
      - To slow your program
      - To avoid parameters
      answer: To group reusable logic
    content_blocks:
    - type: heading1
      content:
        text: Functions
    - type: explanation
      content:
        text: 'A function is a reusable recipe: give it inputs, get a result. It keeps
          code tidy and avoids repetition.'
    - type: heading2
      content:
        text: Declaring a function
    - type: snippet
      content:
        code: "func greet() {\n  print(\"Hello!\")\n}\ngreet()"
    - type: explanation
      content:
        text: Use func name() { ... } for functions without inputs or outputs.
    - type: heading2
      content:
        text: Returning a value
    - type: snippet
      content:
        code: "func square(of number: Int) -> Int {\n  return number * number\n}\n\
          let nine = square(of: 3)  // 9"
    - type: explanation
      content:
        text: Use -> Type to describe the result. return sends the value back.
    - type: heading2
      content:
        text: Why functions matter
    - type: explanation
      content:
        text: They reduce duplication, clarify intent, and make testing easier.
    - type: heading2
      content:
        text: Tips
    - type: unorderedList
      content:
        items:
        - Use clear names that read like sentences.
        - Keep functions small—do one thing well.
        - Prefer returning values over printing inside.
  - id: 9EB0B2D1-9835-4FC4-A0E5-9CD92A86FBA3
    module_name: Parameters & Return Values
    module_number: 14
    multiple_choice:
    - question: Where do parameters go in a Swift function?
      options:
      - Inside parentheses after the name
      - Before func
      - After ->
      - In curly braces
      answer: Inside parentheses after the name
    - question: 'What is the external parameter label in func move(from start: Int,
        to end: Int)?'
      options:
      - start and end
      - from and to
      - (none)
      - move
      answer: from and to
    - question: Which statement returns a value from a function?
      options:
      - give
      - out
      - return
      - yield
      answer: return
    content_blocks:
    - type: heading1
      content:
        text: Parameters & Return Values
    - type: explanation
      content:
        text: Parameters are inputs to your recipe. Labels make calls read naturally;
          the return value hands back the result.
    - type: heading2
      content:
        text: Defining parameters
    - type: snippet
      content:
        code: "func add(_ a: Int, _ b: Int) -> Int {\n  return a + b\n}\nlet sum =\
          \ add(2, 3)  // 5"
    - type: explanation
      content:
        text: Using _ removes external labels at the call site for brevity.
    - type: heading2
      content:
        text: Readable calls with labels
    - type: snippet
      content:
        code: "func move(from start: Int, to end: Int) {\n  print(\"Move from \\(start)\
          \ to \\(end)\")\n}\nmove(from: 1, to: 5)"
    - type: explanation
      content:
        text: External labels (from:, to:) make usage self-documenting.
    - type: heading2
      content:
        text: Multiple returns
    - type: snippet
      content:
        code: "func minMax(_ numbers: [Int]) -> (min: Int, max: Int)? {\n  guard let\
          \ first = numbers.first else { return nil }\n  var minVal = first\n  var\
          \ maxVal = first\n  for n in numbers {\n    if n < minVal { minVal = n }\n\
          \    if n > maxVal { maxVal = n }\n  }\n  return (minVal, maxVal)\n}\nlet\
          \ result = minMax([3,8,2,9])  // (min: 2, max: 9)"
    - type: explanation
      content:
        text: Tuples let you return several values at once. Optionals handle empty
          input.
    - type: explanation
      content:
        text: 'Tip: Choose labels that explain the role of each parameter.'
  - id: 49D8CEC2-5FCC-4185-94BA-D10B25C54390
    module_name: Error Handling
    module_number: 15
    multiple_choice:
    - question: Which keyword marks a function that can throw?
      options:
      - throw
      - throws
      - try
      - catch
      answer: throws
    - question: Which keyword attempts a throwing call?
      options:
      - try
      - attempt
      - do
      - guard
      answer: try
    - question: Which block handles errors when thrown?
      options:
      - catch
      - else
      - finally
      - guard
      answer: catch
    content_blocks:
    - type: heading1
      content:
        text: Error Handling
    - type: explanation
      content:
        text: Things go wrong—files missing, networks down. Swift uses throws/try/catch
          to handle failures cleanly.
    - type: heading2
      content:
        text: Defining errors
    - type: snippet
      content:
        code: 'enum FileError: Error { case notFound, unreadable }'
    - type: explanation
      content:
        text: Conform to Error with an enum so cases are explicit and type-safe.
    - type: heading2
      content:
        text: Throwing and catching
    - type: snippet
      content:
        code: "func loadFile(named: String) throws -> String {\n  throw FileError.notFound\n\
          }\n\ndo {\n  let _ = try loadFile(named: \"notes.txt\")\n} catch FileError.notFound\
          \ {\n  print(\"Missing file\")\n} catch {\n  print(\"Unknown error: \\(error)\"\
          )\n}"
    - type: explanation
      content:
        text: Use do/try/catch to separate the success path from recovery logic.
    - type: heading2
      content:
        text: try?, try!
    - type: snippet
      content:
        code: 'let maybe = try? loadFile(named: "notes.txt")   // Optional

          let forced = try! loadFile(named: "notes.txt")  // Crashes if it throws'
    - type: explanation
      content:
        text: try? converts errors to nil; try! crashes on error. Prefer do/try/catch
          unless you’re certain it can’t fail.
    - type: explanation
      content:
        text: 'Tip: Model only real errors as throwing. Use optionals for expected
          absence.'
  finalReview:
    content_blocks:
    - type: heading1
      content:
        text: Chapter 4 Review
    - type: explanation
      content:
        text: You wrote functions to bundle logic, used parameters and return values
          for clarity, and handled failure paths with throws/try/catch.
    - type: explanation
      content:
        text: 'Rules of thumb: small focused functions, descriptive parameter labels,
          and precise error modeling.'
