chapters:
- chapterName: 'Chapter 4: Functions & Errors'
  modules:
  - id: 797D9ED5-51AC-40FB-9063-9810E4C972FB
    module_name: Functions
    module_number: 13
    multiple_choice:
    - question: Which keyword starts a function in Swift?
      options:
      - func
      - function
      - def
      - fn
      answer: func
    - question: What symbol introduces the return type?
      options:
      - ->
      - ':'
      - =>
      - returns
      answer: ->
    - question: What is a good reason to use a function?
      options:
      - To repeat code everywhere
      - To group reusable logic
      - To slow your program
      - To avoid parameters
      answer: To group reusable logic
    content_blocks:
    - type: heading1
      content:
        text: Functions
    - type: explanation
      content:
        text: 'Think of a function as a reusable recipe or even a magic spell: you give it some ingredients (inputs), and it returns a tasty dish or a magical result (output). Functions help keep your code neat and save you from repeating yourself over and over.'
    - type: heading2
      content:
        text: Declaring a function
    - type: snippet
      content:
        code: "func greet() {\n  print(\"Hello!\")\n}\ngreet()"
    - type: explanation
      content:
        text: 'Functions start with func followed by a name and parentheses. If your function doesn’t need any inputs or outputs, just keep the parentheses empty like greet() here.'
    - type: heading2
      content:
        text: Returning a value
    - type: snippet
      content:
        code: "func square(of number: Int) -> Int {\n  return number * number\n}\nlet nine = square(of: 3)  // 9"
    - type: explanation
      content:
        text: 'Imagine the arrow -> as a sign pointing to the type of magic your function returns. The return keyword sends the result back to whoever called the function.'
    - type: heading2
      content:
        text: Mini challenge
    - type: explanation
      content:
        text: 'Try this: write a function greet(name:) that prints Hello to someone by name. For example, greet(name: "Anna") should print Hello, Anna!'
    - type: heading2
      content:
        text: Why functions matter
    - type: explanation
      content:
        text: 'Functions help you avoid repeating code, make your intentions clear, and make your programs easier to test and fix.'
    - type: heading2
      content:
        text: Tips
    - type: unorderedList
      content:
        items:
        - Use clear, descriptive names that read like little sentences.
        - Keep functions small—focus on doing one thing well.
        - Prefer returning values instead of printing inside functions, so you can reuse results.
  - id: 9EB0B2D1-9835-4FC4-A0E5-9CD92A86FBA3
    module_name: Parameters & Return Values
    module_number: 14
    multiple_choice:
    - question: Where do parameters go in a Swift function?
      options:
      - Inside parentheses after the name
      - Before func
      - After ->
      - In curly braces
      answer: Inside parentheses after the name
    - question: 'What is the external parameter label in func move(from start: Int, to end: Int)?'
      options:
      - start and end
      - from and to
      - (none)
      - move
      answer: from and to
    - question: Which statement returns a value from a function?
      options:
      - give
      - out
      - return
      - yield
      answer: return
    content_blocks:
    - type: heading1
      content:
        text: Parameters & Return Values
    - type: explanation
      content:
        text: 'Think of parameters as the ingredients you add to your recipe. They are the inputs your function needs to work its magic. The return value is the dish you serve—what your function gives back after cooking.'
    - type: heading2
      content:
        text: Defining parameters
    - type: snippet
      content:
        code: "func add(_ a: Int, _ b: Int) -> Int {\n  return a + b\n}\nlet sum = add(2, 3)  // 5"
    - type: explanation
      content:
        text: 'Using _ means you skip the external label when calling the function, making it shorter but less descriptive.'
    - type: heading2
      content:
        text: Readable calls with labels
    - type: snippet
      content:
        code: "func move(from start: Int, to end: Int) {\n  print(\"Move from \\(start) to \\(end)\")\n}\nmove(from: 1, to: 5)"
    - type: explanation
      content:
        text: 'External labels like from: and to: make calling a function read like a sentence. It’s like giving directions: move from 1 to 5.'
    - type: heading2
      content:
        text: Multiple returns
    - type: snippet
      content:
        code: "func minMax(_ numbers: [Int]) -> (min: Int, max: Int)? {\n  guard let first = numbers.first else { return nil }\n  var minVal = first\n  var maxVal = first\n  for n in numbers {\n    if n < minVal { minVal = n }\n    if n > maxVal { maxVal = n }\n  }\n  return (minVal, maxVal)\n}\nlet result = minMax([3,8,2,9])  // (min: 2, max: 9)"
    - type: explanation
      content:
        text: 'Tuples let you return several values at once, like bringing a tray with multiple dishes. Optionals let you say, "sometimes there might be no dish at all," handling empty inputs safely.'
    - type: heading2
      content:
        text: Mini challenge
    - type: explanation
      content:
        text: 'Write a function that takes your age as a parameter and returns how old you’ll be in 5 years. Try calling it with your current age!'
    - type: explanation
      content:
        text: 'Tip: Choose parameter labels that help the function call read like a natural sentence.'
  - id: 49D8CEC2-5FCC-4185-94BA-D10B25C54390
    module_name: Error Handling
    module_number: 15
    multiple_choice:
    - question: Which keyword marks a function that can throw?
      options:
      - throw
      - throws
      - try
      - catch
      answer: throws
    - question: Which keyword attempts a throwing call?
      options:
      - try
      - attempt
      - do
      - guard
      answer: try
    - question: Which block handles errors when thrown?
      options:
      - catch
      - else
      - finally
      - guard
      answer: catch
    content_blocks:
    - type: heading1
      content:
        text: Error Handling
    - type: explanation
      content:
        text: 'Errors are like real-life mistakes: missing keys, a wrong password, or a lost file. Swift helps you handle these “uh-oh” moments gracefully with throws, try, and catch—like warning labels and safety nets in your code.'
    - type: heading2
      content:
        text: Defining errors
    - type: snippet
      content:
        code: 'enum FileError: Error { case notFound, unreadable }'
    - type: explanation
      content:
        text: 'Create an enum that conforms to Error to list all the possible problems your function might face—this makes error handling clear and type-safe.'
    - type: heading2
      content:
        text: Throwing and catching
    - type: snippet
      content:
        code: "func loadFile(named: String) throws -> String {\n  throw FileError.notFound\n}\n\ndo {\n  let _ = try loadFile(named: \"notes.txt\")\n} catch FileError.notFound {\n  print(\"Missing file\")\n} catch {\n  print(\"Unknown error: \\(error)\")\n}"
    - type: explanation
      content:
        text: 'Mark functions that might fail with throws—this is like putting a warning label on them. Use do/try/catch to try the risky code and handle problems without crashing.'
    - type: heading2
      content:
        text: try?, try!
    - type: snippet
      content:
        code: 'let maybe = try? loadFile(named: "notes.txt")   // Optional

let forced = try! loadFile(named: "notes.txt")  // Crashes if it throws'
    - type: explanation
      content:
        text: 'try? turns errors into nil values—safe and easy. try! forces the call and crashes if there’s an error—use carefully. Most of the time, do/try/catch is your friend.'
    - type: heading2
      content:
        text: Mini challenge
    - type: explanation
      content:
        text: 'Create your own error enum called LoginError with cases wrongPassword and userNotFound. Then write a throwing function that simulates a login check and throws these errors.'
    - type: heading2
      content:
        text: Reflection
    - type: explanation
      content:
        text: 'When would you prefer using optionals instead of throwing errors? Think about situations where absence is normal, not a mistake.'
    - type: explanation
      content:
        text: 'Tip: Model only real errors as throwing. Use optionals for expected absence.'
  finalReview:
    content_blocks:
    - type: heading1
      content:
        text: Chapter 4 Review
    - type: explanation
      content:
        text: 'Great job! You’ve learned how to bundle your logic into neat functions, pass information in and out with parameters and return values, and handle mistakes like a pro using error handling.'
    - type: explanation
      content:
        text: 'Remember: small focused functions, clear parameter labels, and thoughtful error modeling make your code stronger and easier to maintain.'
    - type: heading2
      content:
        text: Reflection question
    - type: explanation
      content:
        text: 'Which of these skills—functions, parameters, or error handling—do you think will help you most in your first app? Take a moment to think about how you’ll use them!'
