chapters:
- chapterName: 'Chapter 1: Swift Basics'
  modules:
  - id: D03BD0F4-F09C-4598-954B-D2AF3C40B702
    module_name: Variables & Constants
    module_number: 4
    multiple_choice:
    - question: Which keyword should you prefer by default for safety and clarity?
      options:
      - var
      - let
      - const
      - mut
      answer: let
    - question: What happens if you change a value created with let?
      options:
      - It updates silently
      - Compiler error
      - Runtime warning
      - It converts to var
      answer: Compiler error
    - question: Which line declares a mutable score?
      options:
      - let score = 0
      - var score = 0
      - score var = 0
      - int score = 0
      answer: var score = 0
    content_blocks:
    - type: heading1
      content:
        text: Variables & Constants
    - type: explanation
      content:
        text: Think of var as a backpack you repack during the trip; let is a sealed
          keepsake. Prefer let first—switch to var only when change is required.
    - type: heading2
      content:
        text: Use the right tool
    - type: unorderedList
      content:
        items:
        - 'Use let for facts: birthday, app version, maximumPlayers.'
        - 'Use var for changing state: scores, toggles, counters.'
    - type: snippet
      content:
        code: 'var score = 0

          score += 10

          score -= 2'
    - type: explanation
      content:
        text: Here score is mutable—great for values that evolve while your app runs.
    - type: snippet
      content:
        code: 'let birthYear = 2000

          // birthYear = 1999  // Error: cannot assign to value: ''birthYear'' is
          a ''let'' constant'
    - type: explanation
      content:
        text: Constants make intent obvious and prevent accidental edits; the compiler
          enforces it for you.
    - type: heading2
      content:
        text: Why this matters
    - type: explanation
      content:
        text: Immutability improves safety, readability, and enables compiler optimizations.
    - type: heading2
      content:
        text: Tips
    - type: unorderedList
      content:
        items:
        - Default to let; promote to var only with a real need.
        - Name after purpose, not type (score, not intScore).
        - Keep scope small—declare values close to where they’re used.
  - id: 6F51DFF6-76D7-4D6C-B06E-2FEAFDE1AB4B
    module_name: 'Data Types: Int, Double, String, Bool'
    module_number: 5
    multiple_choice:
    - question: Which type represents whole numbers like 3 or 42?
      options:
      - String
      - Int
      - Double
      - Bool
      answer: Int
    - question: Which type would you use for true/false flags?
      options:
      - Int
      - String
      - Double
      - Bool
      answer: Bool
    - question: What type is 3.14 by default in Swift?
      options:
      - Int
      - Double
      - String
      - Bool
      answer: Double
    content_blocks:
    - type: heading1
      content:
        text: 'Data Types: Int, Double, String, Bool'
    - type: explanation
      content:
        text: 'Swift uses clear boxes for values: Int (whole numbers), Double (decimals),
          String (text), Bool (true/false). Clarity reduces bugs.'
    - type: heading2
      content:
        text: Declaring values
    - type: snippet
      content:
        code: 'let lives: Int = 3

          let pi: Double = 3.14159

          let username: String = "Nova"

          let isPremium: Bool = true'
    - type: explanation
      content:
        text: 'Swift can infer types too. If you write let count = 5, Swift sets it
          to Int. Add : Type when you want explicit intent.'
    - type: heading2
      content:
        text: Working with numbers
    - type: snippet
      content:
        code: 'let apples = 4

          let boxes = 2

          let total = apples * boxes  // 8'
    - type: explanation
      content:
        text: Use Int for counts/indices; prefer Double when precision with decimals
          matters (prices, measurements).
    - type: heading2
      content:
        text: Strings & Bools
    - type: snippet
      content:
        code: 'let greeting = "Hello"

          let shouted = greeting.uppercased()

          let isEmpty = greeting.isEmpty  // false'
    - type: explanation
      content:
        text: Strings come with handy helpers (uppercased, isEmpty). Bools drive decisions
          in conditions.
    - type: explanation
      content:
        text: 'Tip: Keep data meaningful. If you store a yes/no, make it Bool—not
          0/1 or "yes"/"no".'
  - id: 1CAB7DBC-7EF9-4091-8BC2-35C66C54D930
    module_name: String Interpolation
    module_number: 6
    multiple_choice:
    - question: What syntax inserts values into a string?
      options:
      - ${value}
      - (value)
      - \(value)
      - <value>
      answer: \(value)
    - question: Given let name = "Mia", what prints Hello, Mia?
      options:
      - print("Hello, \(name)")
      - print("Hello, (name)")
      - print("Hello, ${name}")
      - print("Hello, name")
      answer: print("Hello, \(name)")
    - question: Why prefer interpolation over concatenation with +?
      options:
      - It’s slower
      - It’s cleaner and safer
      - It only works with Ints
      - It changes types
      answer: It’s cleaner and safer
    content_blocks:
    - type: heading1
      content:
        text: String Interpolation
    - type: explanation
      content:
        text: 'Interpolation is Swift’s fill‑in‑the‑blank: drop values into text using
          \(value). It’s ideal for messages, logs, and UI labels.'
    - type: heading2
      content:
        text: Basic insertion
    - type: snippet
      content:
        code: 'let name = "Mia"

          let score = 87

          print("Hi, \(name)! Your score is \(score).")  // Hi, Mia! Your score is
          87'
    - type: explanation
      content:
        text: Swift converts numbers and other values to text automatically—no manual
          casting or + juggling.
    - type: heading2
      content:
        text: Expressions inside strings
    - type: snippet
      content:
        code: 'print("2 + 2 = \(2 + 2)")  // 2 + 2 = 4

          let items = ["A","B","C"]

          print("Total items: \(items.count)")'
    - type: explanation
      content:
        text: You can run expressions inline (math, counts, function calls) and Swift
          will show the result.
    - type: heading2
      content:
        text: Readable output
    - type: explanation
      content:
        text: Prefer short, focused messages. If it’s getting long, break it into
          multiple prints or assemble parts first.
    - type: explanation
      content:
        text: 'Tip: Interpolation is also great for debugging—print small, meaningful
          facts rather than giant blobs.'
  finalReview:
    content_blocks:
    - type: heading1
      content:
        text: Chapter 1 Review
    - type: explanation
      content:
        text: You practiced choosing between let and var, labeling data with the right
          types, and creating clear output with string interpolation.
    - type: explanation
      content:
        text: 'Rules of thumb: prefer let, pick types that match meaning, and use
          \(value) for clean, safe strings.'
