chapters:
- chapterName: 'Chapter 1: Swift Basics'
  modules:
  - id: D03BD0F4-F09C-4598-954B-D2AF3C40B702
    module_name: Variables & Constants
    module_number: 4
    multiple_choice:
    - question: Which keyword should you prefer by default for safety and clarity?
      options:
      - var
      - let
      - const
      - mut
      answer: let
    - question: What happens if you change a value created with let?
      options:
      - It updates silently
      - Compiler error
      - Runtime warning
      - It converts to var
      answer: Compiler error
    - question: Which line declares a mutable score?
      options:
      - let score = 0
      - var score = 0
      - score var = 0
      - int score = 0
      answer: var score = 0
    content_blocks:
    - type: heading1
      content:
        text: Variables & Constants
    - type: explanation
      content:
        text: 'Think of ''var'' as a backpack you carry on a trip—flexible and open to change. You can add, remove, or swap items anytime. On the other hand, ''let'' is like a sealed keepsake box: once closed, its contents stay the same forever. Using ''let'' means your value is fixed and safe from accidental changes, which helps your code stay predictable and bug-free. Start with ''let'' to keep things simple and only switch to ''var'' when you truly need to change the value over time.'
    - type: heading2
      content:
        text: Use the right tool
    - type: unorderedList
      content:
        items:
        - 'Use let for facts: birthday, app version, maximumPlayers.'
        - 'Use var for changing state: scores, toggles, counters.'
    - type: snippet
      content:
        code: 'var score = 0

score += 10

score -= 2'
    - type: explanation
      content:
        text: 'Here, ''score'' is mutable—like a counter you can increase or decrease as your app runs. This flexibility is perfect for values that evolve, such as game scores or step counts.'
    - type: snippet
      content:
        code: 'let birthYear = 2000

// birthYear = 1999  // Error: cannot assign to value: ''birthYear'' is a ''let'' constant'
    - type: explanation
      content:
        text: 'Constants like ''birthYear'' make your intentions clear: this value won’t change, so the compiler protects it from accidental edits. It’s like writing in ink instead of pencil.'
    - type: heading2
      content:
        text: Why this matters
    - type: explanation
      content:
        text: 'Immutability improves safety, readability, and lets the compiler optimize your code. When values stay the same, your app behaves more reliably and is easier to understand.'
    - type: heading2
      content:
        text: Tips
    - type: unorderedList
      content:
        items:
        - Default to ''let''; promote to ''var'' only with a real need.
        - Name after purpose, not type (score, not intScore).
        - Keep scope small—declare values close to where they’re used.
    - type: explanation
      content:
        text: 'Reflection challenge: Try declaring your own ''var'' for steps walked today and update it as you imagine walking more. How does changing a ''var'' feel compared to a ''let''?'
  - id: 6F51DFF6-76D7-4D6C-B06E-2FEAFDE1AB4B
    module_name: 'Data Types: Int, Double, String, Bool'
    module_number: 5
    multiple_choice:
    - question: Which type represents whole numbers like 3 or 42?
      options:
      - String
      - Int
      - Double
      - Bool
      answer: Int
    - question: Which type would you use for true/false flags?
      options:
      - Int
      - String
      - Double
      - Bool
      answer: Bool
    - question: What type is 3.14 by default in Swift?
      options:
      - Int
      - Double
      - String
      - Bool
      answer: Double
    content_blocks:
    - type: heading1
      content:
        text: 'Data Types: Int, Double, String, Bool'
    - type: explanation
      content:
        text: 'Imagine your data types as familiar objects: ''Int'' is like whole apples you can count one by one; ''Double'' is like slices of apple pie—fractions matter here. ''String'' is a text bubble that carries messages, names, or any words. ''Bool'' is a simple light switch—either ON (true) or OFF (false). Using the right type helps your code understand and handle data correctly, making your app smarter and less error-prone.'
    - type: heading2
      content:
        text: Declaring values
    - type: snippet
      content:
        code: 'let lives: Int = 3

let pi: Double = 3.14159

let username: String = "Nova"

let isPremium: Bool = true'
    - type: explanation
      content:
        text: 'Swift can often guess the type for you. For example, writing ''let count = 5'' lets Swift know ''count'' is an ''Int''. But sometimes, adding the type explicitly clarifies your intent and helps others reading your code.'
    - type: heading2
      content:
        text: Working with numbers
    - type: snippet
      content:
        code: 'let apples = 4

let boxes = 2

let total = apples * boxes  // 8'
    - type: explanation
      content:
        text: 'Use ''Int'' when you need whole numbers like counts or indexes. Use ''Double'' when you need precision, such as prices or measurements that include decimals.'
    - type: heading2
      content:
        text: Strings & Bools
    - type: snippet
      content:
        code: 'let greeting = "Hello"

let shouted = greeting.uppercased()

let isEmpty = greeting.isEmpty  // false'
    - type: explanation
      content:
        text: 'Strings come with handy helpers like ''uppercased()'' to shout your text or ''isEmpty'' to check if a message is blank. Booleans (''Bool'') are perfect for yes/no, true/false decisions that control your app’s flow.'
    - type: explanation
      content:
        text: 'Tip: Keep data meaningful. If you store a yes/no, make it ''Bool''—not 0/1 or "yes"/"no". This clarity helps prevent mistakes and makes your code easier to read.'
    - type: explanation
      content:
        text: 'Mini challenge: Create a ''Double'' for pi, then print a sentence that includes it using string interpolation. How does combining types make your message clearer?'
  - id: 1CAB7DBC-7EF9-4091-8BC2-35C66C54D930
    module_name: String Interpolation
    module_number: 6
    multiple_choice:
    - question: What syntax inserts values into a string?
      options:
      - ${value}
      - (value)
      - \(value)
      - <value>
      answer: \(value)
    - question: Given let name = "Mia", what prints Hello, Mia?
      options:
      - print("Hello, \(name)")
      - print("Hello, (name)")
      - print("Hello, ${name}")
      - print("Hello, name")
      answer: print("Hello, \(name)")
    - question: Why prefer interpolation over concatenation with +?
      options:
      - It’s slower
      - It’s cleaner and safer
      - It only works with Ints
      - It changes types
      answer: It’s cleaner and safer
    content_blocks:
    - type: heading1
      content:
        text: String Interpolation
    - type: explanation
      content:
        text: 'Think of string interpolation as playing fill-in-the-blank Mad Libs with your code. You write a sentence with blanks, and then drop values inside those blanks using \\(value). This makes your messages dynamic, clear, and easy to read—perfect for showing scores, names, or any changing info in your app’s UI or logs.'
    - type: heading2
      content:
        text: Basic insertion
    - type: snippet
      content:
        code: 'let name = "Mia"

let score = 87

print("Hi, \(name)! Your score is \(score).")  // Hi, Mia! Your score is 87'
    - type: explanation
      content:
        text: 'Swift automatically converts numbers and other values to text, so you don’t have to do any manual casting or messy string concatenation with +.'
    - type: heading2
      content:
        text: Expressions inside strings
    - type: snippet
      content:
        code: 'print("2 + 2 = \(2 + 2)")  // 2 + 2 = 4

let items = ["A","B","C"]

print("Total items: \(items.count)")'
    - type: explanation
      content:
        text: 'You can put calculations, function calls, and other expressions right inside your strings, and Swift will evaluate them for you. This makes your output smart and up-to-date.'
    - type: heading2
      content:
        text: Readable output
    - type: explanation
      content:
        text: 'Keep your messages short and focused. If you need a longer message, break it into parts or build it step-by-step before printing.'
    - type: explanation
      content:
        text: 'Tip: Interpolation is also fantastic for debugging—print small, meaningful facts instead of huge blocks of data.'
    - type: explanation
      content:
        text: 'Reflection challenge: Write a string that says Hello to yourself and shows today’s date using interpolation. How does this make your message more personal and dynamic?'
  finalReview:
    content_blocks:
    - type: heading1
      content:
        text: Chapter 1 Review
    - type: explanation
      content:
        text: 'You''ve made great progress mastering the basics of Swift! From understanding when to use ''let'' or ''var'', to choosing the right data types, and crafting clear messages with string interpolation, you''re building a strong foundation for your coding journey.'
    - type: explanation
      content:
        text: 'Remember: prefer ''let'' for safety and clarity, pick data types that match your meaning, and use \\(value) to create clean, readable strings. Keep practicing, and your confidence will grow with every line of code!'
    - type: explanation
      content:
        text: 'Reflection question: What felt easiest to you—constants, data types, or string interpolation? Think about why, and how you can build on that strength as you learn more.'
