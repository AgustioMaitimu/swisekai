chapters:
- chapterName: 'Chapter 6: Structs & Classes'
  modules:
  - id: E9E451B9-4900-4E29-AC38-4E8CFF21EBCB
    module_name: Structs
    module_number: 19
    multiple_choice:
    - question: Which keyword defines a struct?
      options:
      - struct
      - class
      - enum
      - record
      answer: struct
    - question: 'Structs are:'
      options:
      - Value types
      - Reference types
      - Protocols
      - Enums
      answer: Value types
    - question: 'Assigning a struct to another variable:'
      options:
      - Copies the value
      - References the same instance
      - Fails
      - None
      answer: Copies the value
    content_blocks:
    - type: heading1
      content:
        text: Structs
    - type: explanation
      content:
        text: 'Think of a struct as a cookie mold—a blueprint to make cookies. Each cookie you bake is its own independent treat, just like each struct you create holds its own data. Structs are lightweight blueprints for your data.'
    - type: heading2
      content:
        text: Defining a struct
    - type: snippet
      content:
        code: "struct User {\n  var name: String\n  var age: Int\n}\nvar u1 = User(name:\
          \ \"Sam\", age: 20)"
    - type: explanation
      content:
        text: 'Properties are like the ingredients inside your cookie mold—they store the data. When you create a struct, Swift automatically gives you an initializer if you provide values for all properties.'
    - type: heading2
      content:
        text: Value semantics – independent copies
    - type: snippet
      content:
        code: 'var u2 = u1

u2.name = "Alex"

print(u1.name)  // Sam

print(u2.name)  // Alex'
    - type: explanation
      content:
        text: 'When you assign a struct to another variable, it copies the data—like baking two separate cookies from the same mold. Changing one doesn’t affect the other!'
    - type: explanation
      content:
        text: 'Mini challenge: Create a struct Book with properties title and author. Make two copies of a Book instance and change the title of one. Can you see how they stay independent?'
    - type: explanation
      content:
        text: 'Reflection: Why might it be useful that structs create independent copies? Think about scenarios where you want to avoid accidental changes.'
    - type: explanation
      content:
        text: 'Tip: Prefer structs for models, settings, and small reusable types.'
  - id: 903871AB-6684-494D-90B9-2A7C8F20AB69
    module_name: Properties & Methods
    module_number: 20
    multiple_choice:
    - question: 'Properties are:'
      options:
      - Variables inside a type
      - Functions inside a type
      - Enums
      - Operators
      answer: Variables inside a type
    - question: 'Methods are:'
      options:
      - Functions inside a type
      - Properties of a class
      - Structs only
      - Enums
      answer: Functions inside a type
    - question: Which keyword makes a property belong to the type itself?
      options:
      - static
      - class
      - type
      - struct
      answer: static
    content_blocks:
    - type: heading1
      content:
        text: Properties & Methods
    - type: explanation
      content:
        text: 'Think of properties as the characteristics or data inside your type—like the color or size of a toy. Methods are the actions or behaviors your type can perform—like a toy that can move or make sounds.'
    - type: heading2
      content:
        text: Stored and computed properties
    - type: snippet
      content:
        code: "struct Circle {\n  var radius: Double\n  var area: Double { radius\
          \ * radius * 3.14 }\n}\nlet c = Circle(radius: 2)\nprint(c.area)  // 12.56"
    - type: explanation
      content:
        text: 'Stored properties are like items in your fridge—they hold actual data. Computed properties are like a calculator: they don’t store data but compute it on the fly when you ask for it.'
    - type: heading2
      content:
        text: Instance vs static properties
    - type: snippet
      content:
        code: "struct Counter {\n  static var totalCreated = 0\n  init() { Counter.totalCreated\
          \ += 1 }\n}\nlet a = Counter()\nlet b = Counter()\nprint(Counter.totalCreated)\
          \  // 2"
    - type: explanation
      content:
        text: 'Static properties belong to the type itself, not to individual instances. Think of it as a shared counter that tracks how many times something has been created.'
    - type: heading2
      content:
        text: Methods
    - type: snippet
      content:
        code: "struct Car {\n  var speed = 0\n  mutating func accelerate() { speed\
          \ += 10 }\n}\nvar myCar = Car()\nmyCar.accelerate()\nprint(myCar.speed)\
          \  // 10"
    - type: explanation
      content:
        text: 'Methods are functions inside the type. In structs, if a method changes properties, mark it as mutating.'
    - type: explanation
      content:
        text: 'Mini challenge: Add a method to Circle that prints a friendly message with its radius.'
    - type: explanation
      content:
        text: 'Reflection: When would you use a static property instead of an instance property? Think about shared data versus individual data.'
  - id: 7BA7F91F-B01F-48A0-BA27-84F49AC72EA0
    module_name: Classes & Inheritance
    module_number: 21
    multiple_choice:
    - question: Which keyword defines a class?
      options:
      - class
      - struct
      - object
      - enum
      answer: class
    - question: 'Classes are:'
      options:
      - Reference types
      - Value types
      - Protocols
      - Enums
      answer: Reference types
    - question: 'Inheritance means:'
      options:
      - A class extends another
      - Copy value
      - Delete data
      - Override struct
      answer: A class extends another
    content_blocks:
    - type: heading1
      content:
        text: Classes & Inheritance
    - type: explanation
      content:
        text: 'Classes are reference types—imagine multiple remotes controlling the same TV. Changing the channel on one remote affects what you see on the TV, no matter which remote you use.'
    - type: heading2
      content:
        text: Defining a class
    - type: snippet
      content:
        code: "class Animal {\n  func speak() { print(\"...\") }\n}\nclass Dog: Animal\
          \ {\n  override func speak() { print(\"Woof\") }\n}\nlet d = Dog()\nd.speak()\
          \  // Woof"
    - type: explanation
      content:
        text: 'Inheritance is like a child inheriting traits from a parent but also customizing them. Here, Dog inherits from Animal and overrides speak().'
    - type: heading2
      content:
        text: Reference semantics
    - type: snippet
      content:
        code: 'let d1 = Dog()

let d2 = d1

d2.speak()

d1.speak()  // both Woof'
    - type: explanation
      content:
        text: 'Both d1 and d2 point to the same Dog instance—changes through one are seen by the other.'
    - type: heading2
      content:
        text: Deinitializers
    - type: snippet
      content:
        code: "class FileHandler {\n  deinit { print(\"Closing resources\") }\n}"
    - type: explanation
      content:
        text: 'Classes can clean up resources with deinit before they are removed from memory.'
    - type: explanation
      content:
        text: 'Mini challenge: Make a class Vehicle with a drive() method, and subclass Car that overrides it to print \"Vroom\".'
    - type: explanation
      content:
        text: 'Reflection: Why would you choose a class over a struct in some cases? Think about shared state and inheritance.'
    - type: explanation
      content:
        text: 'Tip: Prefer structs unless you specifically need inheritance or reference semantics.'
  finalReview:
    content_blocks:
    - type: heading1
      content:
        text: Chapter 6 Review
    - type: explanation
      content:
        text: 'Great job! You learned that structs are like independent cookies—each copy stands alone. Classes are like shared remotes controlling the same TV. Both can have properties (data) and methods (actions).'
    - type: explanation
      content:
        text: 'Reflection: In your first project, do you imagine using structs, classes, or both? Why? Think about what fits your needs best.'
