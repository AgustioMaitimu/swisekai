chapters:
- chapterName: 'Chapter 3: Logic & Control Flow'
  modules:
  - id: 76261605-1686-466C-966F-06819B04C7AF
    module_name: Operators
    module_number: 10
    multiple_choice:
    - question: What does == check?
      options:
      - Assignment
      - Equality
      - Inequality
      - Reference
      answer: Equality
    - question: Which operator means not equal?
      options:
      - '!='
      - ==
      - <>
      - '!'
      answer: '!='
    - question: Which operator adds two numbers?
      options:
      - +
      - '-'
      - '*'
      - /
      answer: +
    content_blocks:
    - type: heading1
      content:
        text: Operators
    - type: explanation
      content:
        text: Operators are the small symbols that let you do math and comparisons
          in Swift.
    - type: heading2
      content:
        text: Math operators
    - type: snippet
      content:
        code: 'let sum = 5 + 3    // 8

          let diff = 5 - 3   // 2

          let prod = 5 * 3   // 15

          let div = 10 / 2   // 5'
    - type: explanation
      content:
        text: Use +, -, *, / for basic arithmetic just like in normal math.
    - type: heading2
      content:
        text: Comparison operators
    - type: snippet
      content:
        code: 'let a = 5

          let b = 8

          print(a == b)  // false

          print(a != b)  // true

          print(a < b)   // true'
    - type: explanation
      content:
        text: Comparison operators return Bool values—true or false—based on the relation.
    - type: heading2
      content:
        text: Logical operators
    - type: snippet
      content:
        code: 'let loggedIn = true

          let isAdmin = false

          print(loggedIn && isAdmin)  // false

          print(loggedIn || isAdmin) // true'
    - type: explanation
      content:
        text: Use && for AND, || for OR, ! for NOT.
    - type: explanation
      content:
        text: 'Tip: Operators are the glue for logic and math—practice mixing them
          with conditions.'
  - id: 92A063D4-055D-41D0-A286-BB8A72BBD5D9
    module_name: Conditions
    module_number: 11
    multiple_choice:
    - question: Which keyword starts a conditional?
      options:
      - if
      - for
      - while
      - guard
      answer: if
    - question: Which keyword provides fallback if if fails?
      options:
      - else
      - elif
      - then
      - default
      answer: else
    - question: Which operator is used for AND?
      options:
      - '&&'
      - '||'
      - and
      - +
      answer: '&&'
    content_blocks:
    - type: heading1
      content:
        text: Conditions
    - type: explanation
      content:
        text: Conditions let your program decide what to do, like traffic lights guiding
          cars.
    - type: heading2
      content:
        text: If statements
    - type: snippet
      content:
        code: "let age = 20\nif age >= 18 {\n  print(\"Adult\")\n} else {\n  print(\"\
          Minor\")\n}"
    - type: explanation
      content:
        text: If checks a condition; if true, it runs the first block. Else handles
          the other case.
    - type: heading2
      content:
        text: Else if for multiple choices
    - type: snippet
      content:
        code: "let score = 75\nif score > 90 {\n  print(\"A\")\n} else if score >\
          \ 70 {\n  print(\"B\")\n} else {\n  print(\"C\")\n}"
    - type: explanation
      content:
        text: Else if lets you test more than two paths.
    - type: heading2
      content:
        text: Guard for early exit
    - type: snippet
      content:
        code: "func enter(clubAge: Int) {\n  guard clubAge >= 18 else {\n    print(\"\
          Go home\")\n    return\n  }\n  print(\"Welcome in!\")\n}"
    - type: explanation
      content:
        text: 'Guard is the opposite: it ensures a condition is true, otherwise it
          exits early.'
    - type: explanation
      content:
        text: 'Tip: Use if for branching logic, guard for validation and cleaner code.'
  - id: FC30AF60-360C-4BDA-880C-5CDFB2719212
    module_name: Loops
    module_number: 12
    multiple_choice:
    - question: Which loop runs a set number of times?
      options:
      - for-in
      - while
      - repeat-while
      - switch
      answer: for-in
    - question: Which loop checks its condition before running?
      options:
      - while
      - repeat-while
      - for
      - check
      answer: while
    - question: Which loop runs the body at least once?
      options:
      - repeat-while
      - while
      - for-in
      - switch
      answer: repeat-while
    content_blocks:
    - type: heading1
      content:
        text: Loops
    - type: explanation
      content:
        text: Loops let you repeat code without copy-pasting—perfect for lists and
          counters.
    - type: heading2
      content:
        text: For-in loop
    - type: snippet
      content:
        code: "for i in 1...3 {\n  print(\"Iteration \\(i)\")\n}"
    - type: explanation
      content:
        text: for-in repeats for a fixed range or over a collection.
    - type: heading2
      content:
        text: While loop
    - type: snippet
      content:
        code: "var count = 0\nwhile count < 3 {\n  print(count)\n  count += 1\n}"
    - type: explanation
      content:
        text: While checks condition first; runs only if it’s true.
    - type: heading2
      content:
        text: Repeat-while loop
    - type: snippet
      content:
        code: "var n = 0\nrepeat {\n  print(n)\n  n += 1\n} while n < 3"
    - type: explanation
      content:
        text: Repeat-while runs at least once before checking the condition.
    - type: explanation
      content:
        text: 'Tip: Use for-in when you know how many times, while/repeat-while when
          you don’t.'
  finalReview:
    content_blocks:
    - type: heading1
      content:
        text: Chapter 3 Review
    - type: explanation
      content:
        text: You used operators for math and logic, conditions for branching, and
          loops for repetition.
    - type: explanation
      content:
        text: 'Rule of thumb: operators connect values, conditions guide paths, loops
          repeat work.'
