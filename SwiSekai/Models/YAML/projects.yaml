    content:
      text: 'What you''re building: readable movement calls that return both distance and direction.'
  - type: explanation
    content:
      text: 'Concepts to implement: external parameter labels, tuple return types, derived values (absolute distance, direction by sign).'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: 'Milestones to verify: (1) Calls read like sentences; (2) Distance is non-negative; (3) Direction is "forward" when end ≥ start, otherwise "back".'
      - type: explanation
        content:
          text: '**Step-by-step implementation:** factory returns a closure • captured variable stores state • each factory call creates independent state.'
      - type: explanation
        content:
          text: '**Common pitfalls:** Assuming two counters share state, forgetting to store the returned closure, mixing global and captured state.'
      - type: explanation
        content:
          text: |
            **Example output:**
            1 2
            1
      - type: explanation
        content:
          text: '**Step 1 — Define the API:** Return both distance and direction.'
      - type: snippet
        content:
          code: |
            func move(from start:Int, to end:Int) -> (distance:Int, direction:String) {
              let d = end - start
              let dir = d >= 0 ? "forward" : "back"
              return (abs(d), dir)
            }
      - type: explanation
        content:
          text: '**Step 2 — Call naturally:**'
      - type: snippet
        content:
          code: |
            let result = move(from: 3, to: 10)
            print("Moved \(result.distance) steps \(result.direction)")
