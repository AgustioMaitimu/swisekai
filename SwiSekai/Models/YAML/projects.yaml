      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: 'Milestones to verify: (1) Throw path prints "File not found"; (2) Unknown errors print with description; (3) `try?` returns nil and you print a default.'
      - type: explanation
        content:
          text: '**Step-by-step implementation:** chain `map` → `filter` → `reduce` • keep transformations focused • derive ranks with `sorted`.'
      - type: explanation
        content:
          text: '**Common pitfalls:** Mutating during iteration, confusing in-place vs. non-mutating versions, forgetting initial `reduce` value.'
      - type: explanation
        content:
          text: |
