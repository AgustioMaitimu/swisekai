    content:
      text: Computed properties derive values from other state, and mutating methods
        let structs evolve safely.
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 20 (Properties & Methods)**: combine `mutating` methods
        with `static` members for shared facts.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: '**Step 1 — Define the gauge:**'
      - type: snippet
        content:
          code: struct Gauge { var speed:Double; var isFast:Bool { speed > 80 } }
      - type: explanation
        content:
          text: '**Step 2 — Change state:**'
      - type: snippet
        content:
          code: 'extension Gauge { mutating func boost(){ speed += 20 } }

            var g = Gauge(speed:70)

            print(g.isFast)

            g.boost()

            print(g.isFast)'
      - type: explanation
        content:
          text: '**Step 3 — Shared limits:**'
      - type: snippet
        content:
          code: 'extension Gauge { static let maxSafeSpeed = 110.0 }

            print(Gauge.maxSafeSpeed)'
  - type: heading2
