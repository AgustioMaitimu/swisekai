projects:
- id: C868C4EB-F0A1-429F-9EDB-601AE8BA08A1
  project_name: Quick Habit Tracker
  project_description: Track a habit with a fixed name and an evolving streak, and
    print friendly progress updates.
  project_difficulty: Easy
  level_prerequisite: 4
  content_blocks:
  - type: heading1
    content:
      text: Quick Habit Tracker
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: 'You’ll model a real habit with two values: a **name** that never changes
        and a **streak** that increases over time. This builds muscle memory for constants
        vs. variables and for small, safe mutations.'
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 4 (Variables & Constants)**: prefer `let` for data that
        shouldn’t change (habit name), `var` for data that will (streak). Use **string
        interpolation** to print clear feedback.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: '**Step 1 — Declare your data:** Use a constant for the habit name
            and a variable for the streak.'
      - type: snippet
        content:
          code: 'let habitName: String = "Read"

            var streak: Int = 0

            print("Habit: \(habitName) • Streak: \(streak) day(s)")'
      - type: explanation
        content:
          text: '**Step 2 — Update the streak:** Simulate a completed day by incrementing
            the streak.'
      - type: snippet
        content:
          code: 'streak += 1

            print("Nice! You''ve kept \(habitName) for \(streak) day(s)")'
      - type: explanation
        content:
          text: '**Step 3 — Add a goal and report progress:** Compare the current
            streak to a goal and show how far you are.'
      - type: snippet
        content:
          code: 'let streakGoal: Int = 7

            let remaining = max(0, streakGoal - streak)

            print(remaining == 0 ? "Goal met!" : "\(remaining) day(s) to reach \(streakGoal)")'
      - type: explanation
        content:
          text: '**Step 4 — Reset logic (optional):** If you miss a day, reset the
            streak and print a supportive message.'
      - type: snippet
        content:
          code: "let missedToday = false\nif missedToday {\n  streak = 0\n  print(\"\
            No worries! Restart \\(habitName) tomorrow \U0001F4AA\")\n}"
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: 'Add a celebratory message for specific milestones (e.g., 3, 7, 30). Consider
        pluralization: “1 day” vs “2 days”.'
- id: BAB04F4F-571D-47CF-8F7B-83D34C6C5818
  project_name: Profile Badge
  project_description: Build a one-line badge from typed values and make the text
    friendly for humans.
  project_difficulty: Easy
  level_prerequisite: 6
  content_blocks:
  - type: heading1
    content:
      text: Profile Badge
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: You’ll combine multiple basic types into a readable string. This simulates
        real UI text like profile headers or status labels.
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: Grounded in **Module 6 (String Interpolation)** and type basics. Let Swift
        format values with `\(value)` instead of manual conversions. Add tiny logic
        (ternary) to produce friendly labels.
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: '**Step 1 — Define the data:** Choose realistic values so your output
            reads like a real app.'
      - type: snippet
        content:
          code: 'let name: String = "Mina"

            let age: Int = 20

            let isPro: Bool = false'
      - type: explanation
        content:
          text: '**Step 2 — First pass badge:** Print a basic badge using interpolation.'
      - type: snippet
        content:
          code: 'let badge = "User: \(name) • Age: \(age) • Pro: \(isPro)"

            print(badge)'
      - type: explanation
        content:
          text: '**Step 3 — Friendlier status label:** Map your boolean to human language.'
      - type: snippet
        content:
          code: 'let status = isPro ? "Pro Member" : "Free Member"

            print("Status: \(status)")'
      - type: explanation
        content:
          text: '**Step 4 — Refine the copy:** Show a natural sentence and handle
            pluralization.'
      - type: snippet
        content:
          code: 'let years = age == 1 ? "year" : "years"

            print("\(name) is \(age) \(years) old.")'
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: Show an upsell line only when `isPro == false` (e.g., “Upgrade to Pro
        for more features!”). Try adding a `credits` Int and show it with a coin symbol.
- id: 0BFE530C-2F9B-4765-BDB1-171DC160F518
  project_name: Shopping List
  project_description: Create, update, sort, and summarize a shopping list with safe
    index access.
  project_difficulty: Easy
  level_prerequisite: 7
  content_blocks:
  - type: heading1
    content:
      text: Shopping List
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: Arrays are perfect for ordered lists in apps. You’ll practice add/remove,
        count checks, sorting, and safe subscripting.
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 7 (Arrays)**: use `.append`, `.remove(at:)`, `.count`,
        `.isEmpty`, and `sorted()` for a tidy experience.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: '**Step 1 — Start with a list:** Print count and contents so you see
            state changes.'
      - type: snippet
        content:
          code: 'var list: [String] = ["Milk", "Eggs"]

            print("Count: \(list.count) • Items: \(list)")'
      - type: explanation
        content:
          text: '**Step 2 — Add and remove safely:** Always check the index exists
            before removing.'
      - type: snippet
        content:
          code: "list.append(\"Bread\")\nif list.indices.contains(1) {\n  let removed\
            \ = list.remove(at: 1)\n  print(\"Removed: \\(removed)\")\n}\nprint(\"\
            Now: \\(list)\")"
      - type: explanation
        content:
          text: '**Step 3 — Present nicely:** Print each item on its own line with
            a bullet.'
      - type: snippet
        content:
          code: for item in list { print("• \(item)") }
      - type: explanation
        content:
          text: '**Step 4 — Sort for a tidy UI:** Show the sorted list as final output.'
      - type: snippet
        content:
          code: 'let sortedList = list.sorted()

            print("Sorted: \(sortedList)")'
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: Add a `hasItem(_:)` helper using `contains` and guard against empty input
        when removing.
- id: 2A9173DE-5B4F-4CE1-AE5E-5E68B92B0D67
  project_name: Student Directory
  project_description: Use a dictionary for labeled homerooms and a set for unique
    house colors.
  project_difficulty: Medium
  level_prerequisite: 9
  content_blocks:
  - type: heading1
    content:
      text: Student Directory
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: Dictionaries provide fast key→value lookups, and sets ensure items are
        unique—both appear everywhere in app data models.
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Modules 8–9 (Dictionaries & Sets)**: use subscripts to add/update,
        `??` for safe reads, and sets to deduplicate automatically.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: '**Step 1 — Define the structures:** Seed with a couple of values.'
      - type: snippet
        content:
          code: 'var homeroom: [String: String] = ["Kai":"A2"]

            var houseColors: Set<String> = ["Red", "Blue", "Red"]'
      - type: explanation
        content:
          text: '**Step 2 — Add/update entries:** Subscripts both insert and modify
            by key.'
      - type: snippet
        content:
          code: 'homeroom["Zoe"] = "B1"   // insert

            homeroom["Kai"] = "A3"   // update'
      - type: explanation
        content:
          text: '**Step 3 — Safe reads return optionals:** Provide a default for missing
            keys.'
      - type: snippet
        content:
          code: 'print("Kai’s room: \(homeroom["Kai"] ?? "N/A")")'
      - type: explanation
        content:
          text: '**Step 4 — Sets remove duplicates automatically:**'
      - type: snippet
        content:
          code: 'print("House colors: \(houseColors)")

            houseColors.insert("Green")

            print("Updated colors: \(houseColors)")'
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: Iterate over all keys and print a roster. If a student transfers, update
        their room and log the change.
- id: CA8D4E9B-4CC5-4660-8B2F-8A3A2C58A2EB
  project_name: Fitness Points Calculator
  project_description: Compute daily points with arithmetic and conditions, then explain
    the bonuses.
  project_difficulty: Easy
  level_prerequisite: 10
  content_blocks:
  - type: heading1
    content:
      text: Fitness Points Calculator
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: You’ll combine math with comparisons to award bonuses. Clear printouts
        help users understand why they got a score.
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 10 (Operators)**: arithmetic (+, -, *, /), comparison (>=),
        and simple boolean logic with `&&`.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: '**Step 1 — Inputs and base score:** Start from simple numbers for
            easy testing.'
      - type: snippet
        content:
          code: 'let steps = 6500

            let workouts = 1

            var points = (steps / 1000) * 2 + (workouts * 5)

            print("Base points: \(points)")'
      - type: explanation
        content:
          text: '**Step 2 — Goals and bonuses:** Apply a step bonus when the goal
            is met.'
      - type: snippet
        content:
          code: if steps >= 8000 { points += 3; print("Step goal bonus +3") }
      - type: explanation
        content:
          text: '**Step 3 — Stretch bonus:** Combine conditions with AND.'
      - type: snippet
        content:
          code: if steps >= 8000 && workouts >= 2 { points += 5; print("Combo bonus
            +5") }
      - type: explanation
        content:
          text: '**Step 4 — Final message:** Provide clear feedback.'
      - type: snippet
        content:
          code: 'print(points >= 15 ? "Great day! \(points) pts" : "Keep going: \(points)
            pts")'
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: Extract the bonus logic into functions for easier testing and reuse.
- id: CE8F3500-9C02-4B5B-AFBE-DEF9DEB06621
  project_name: Access Gate
  project_description: Validate ticket first with `guard`, then branch on age.
  project_difficulty: Easy
  level_prerequisite: 11
  content_blocks:
  - type: heading1
    content:
      text: Access Gate
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: This shows how early‑exit validation keeps your main path unindented and
        easier to read.
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 11 (Conditions)**: prefer `guard` for required conditions
        and `if/else` for branching choices.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: '**Step 1 — Model inputs:** Keep them easy to tweak while testing.'
      - type: snippet
        content:
          code: 'let age = 17

            let hasTicket = true'
      - type: explanation
        content:
          text: '**Step 2 — Gate function with guard:** Exit early if the requirement
            fails.'
      - type: snippet
        content:
          code: "func enter(age: Int, hasTicket: Bool) {\n  guard hasTicket else {\
            \ print(\"Ticket required\"); return }\n  if age >= 18 { print(\"Welcome!\"\
            ) } else { print(\"Need an adult\") }\n}\nenter(age: age, hasTicket: hasTicket)"
      - type: explanation
        content:
          text: '**Step 3 — Variations:** Try different values to ensure each branch
            prints correctly.'
      - type: snippet
        content:
          code: 'enter(age: 20, hasTicket: true)

            enter(age: 16, hasTicket: false)'
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: Add a `vip` flag that bypasses age checks, but still requires a ticket.
- id: DAA35ED6-38D8-468E-A54F-3DAE637DA865
  project_name: Countdown Display
  project_description: Compare `for-in`, `while`, and `repeat-while` to print short
    sequences.
  project_difficulty: Easy
  level_prerequisite: 12
  content_blocks:
  - type: heading1
    content:
      text: Countdown Display
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: Repetition is everywhere—learn which loop fits which scenario and how
        to keep loop logic simple.
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 12 (Loops)**: ranges for fixed loops; `while` for pre-check;
        `repeat-while` for do‑then‑check.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: '**Step 1 — for‑in with a reversed range:** Perfect for fixed cycles.'
      - type: snippet
        content:
          code: 'for n in (1...3).reversed() { print(n) }

            print("Go!")'
      - type: explanation
        content:
          text: '**Step 2 — while for pre‑check conditions:** Runs zero or more times.'
      - type: snippet
        content:
          code: 'var i = 0

            while i < 3 { print(i); i += 1 }'
      - type: explanation
        content:
          text: '**Step 3 — repeat‑while for at‑least‑once:** Useful for prompt loops.'
      - type: snippet
        content:
          code: 'var n = 0

            repeat { print(n); n += 1 } while n < 1'
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: Print only even numbers from 0...10 using a loop of your choice.
- id: FE3C5A42-96CA-46CB-938A-44E74F83EB9F
  project_name: Math Toolkit
  project_description: Create small, reusable helpers and test them with sample data.
  project_difficulty: Medium
  level_prerequisite: 13
  content_blocks:
  - type: heading1
    content:
      text: Math Toolkit
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: Functions make logic reusable and testable—great for calculators, utilities,
        and pipeline steps.
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 13 (Functions)**: keep functions small, name them clearly,
        and prefer returning values over printing inside.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: '**Step 1 — Define helpers:** Start with simple, testable functions.'
      - type: snippet
        content:
          code: 'func isEven(_ n:Int) -> Bool { n % 2 == 0 }

            func cube(_ n:Int) -> Int { n*n*n }'
      - type: explanation
        content:
          text: '**Step 2 — Try them out:**'
      - type: snippet
        content:
          code: 'print(isEven(4))  // true

            print(cube(3))    // 27'
      - type: explanation
        content:
          text: '**Step 3 — Extend the set:** Add an average helper for arrays.'
      - type: snippet
        content:
          code: "func average(_ values:[Double]) -> Double {\n  guard !values.isEmpty\
            \ else { return 0 }\n  var total = 0.0\n  for v in values { total += v\
            \ }\n  return total / Double(values.count)\n}\nprint(average([1,2,3,4]))\
            \  // 2.5"
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: Write `clamp(_ value:min:max:)` that limits a number into a range.
- id: 170F58E0-3F63-472A-800A-D5B17CC72B86
  project_name: Readable Moves
  project_description: Make calls that read like sentences using external parameter
    labels.
  project_difficulty: Medium
  level_prerequisite: 14
  content_blocks:
  - type: heading1
    content:
      text: Readable Moves
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: Well‑named labels make call sites self‑documenting and reduce mistakes.
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 14 (Parameters & Return Values)**: use labels like `from:`
        and `to:` and return tuples for multi‑value results.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: '**Step 1 — Define the API:** Return both distance and direction.'
      - type: snippet
        content:
          code: "func move(from start:Int, to end:Int) -> (distance:Int, direction:String)\
            \ {\n  let d = end - start\n  let dir = d >= 0 ? \"forward\" : \"back\"\
            \n  return (abs(d), dir)\n}"
      - type: explanation
        content:
          text: '**Step 2 — Call naturally:**'
      - type: snippet
        content:
          code: 'let result = move(from: 3, to: 10)

            print("Moved \(result.distance) steps \(result.direction)")'
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: Add a label `by steps:` to shift a position and return the new coordinate.
- id: 6A50F863-A56C-4AF8-AFDC-1C77620F80F9
  project_name: File Loader (Mock)
  project_description: Practice error modeling and recovery without needing real files.
  project_difficulty: Medium
  level_prerequisite: 15
  content_blocks:
  - type: heading1
    content:
      text: File Loader (Mock)
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: Good error handling shows the happy path and the recovery path clearly,
        keeping both readable.
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 15 (Error Handling)**: model errors with an `enum`, use
        `throws`, and handle with `do/try/catch`. Prefer `try?` for quick optional
        fallbacks.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: '**Step 1 — Define errors:** Make failures explicit.'
      - type: snippet
        content:
          code: 'enum LoadError: Error { case missing, unreadable }'
      - type: explanation
        content:
          text: '**Step 2 — Throwing function:** Signal failure with `throws`.'
      - type: snippet
        content:
          code: func load(name:String) throws -> String { throw LoadError.missing
            }
      - type: explanation
        content:
          text: '**Step 3 — Handle outcomes:** Separate success from recovery.'
      - type: snippet
        content:
          code: "do {\n  let _ = try load(name:\"data.json\")\n  print(\"Loaded\"\
            )\n} catch LoadError.missing {\n  print(\"File not found\")\n} catch {\n\
            \  print(\"Unknown error: \\(error)\")\n}"
      - type: explanation
        content:
          text: '**Step 4 — Optional shortcut:**'
      - type: snippet
        content:
          code: 'let maybe = try? load(name:"config.json")

            print(maybe ?? "Using defaults")'
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: Extend `LoadError` with another case and handle it with a custom message.
- id: 86F3BB46-19E5-45A2-AA4B-4C864ABEFEC1
  project_name: Action Queue
  project_description: Collect closures and run them later like queued tasks.
  project_difficulty: Medium
  level_prerequisite: 16
  content_blocks:
  - type: heading1
    content:
      text: Action Queue
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: Closures package behavior. Storing them lets you trigger actions at the
        right moment (e.g., button callbacks).
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 16 (Intro to Closures)**: declare `() -> Void` closures,
        store in arrays, and execute with `forEach`.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: '**Step 1 — Define actions:** Start with a couple of closures.'
      - type: snippet
        content:
          code: 'let say = { print("Hi") }

            let shout: () -> Void = { print("HEY!") }'
      - type: explanation
        content:
          text: '**Step 2 — Queue & run:**'
      - type: snippet
        content:
          code: '[say, shout].forEach { $0() }'
      - type: explanation
        content:
          text: '**Step 3 — Parameterized action:**'
      - type: snippet
        content:
          code: 'let echo: (String) -> Void = { text in print("• " + text) }

            echo("Swift")'
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: 'Make a function `schedule(_ action: @escaping () -> Void)` and call it
        later.'
- id: 6EDCA7B1-F517-4638-94FF-2385C7ABFF76
  project_name: Personal Counter
  project_description: Return a closure that remembers and updates its own count.
  project_difficulty: Medium
  level_prerequisite: 17
  content_blocks:
  - type: heading1
    content:
      text: Personal Counter
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: Captured values let closures hold state between calls—ideal for counters,
        throttles, or memoization.
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 17 (Capturing Values)**: closures keep captured variables
        alive even after the outer function returns.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: '**Step 1 — Factory function:** Create a counter that remembers.'
      - type: snippet
        content:
          code: func makeCounter() -> () -> Int { var n=0; return { n += 1; return
            n } }
      - type: explanation
        content:
          text: '**Step 2 — Independent instances:** Each capture is isolated.'
      - type: snippet
        content:
          code: 'let c1 = makeCounter(); print(c1(), c1())

            let c2 = makeCounter(); print(c2())'
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: 'Return `(next: () -> Int, reset: () -> Void)` so you can clear the count.'
- id: 5F3FF8EB-672C-4258-BA74-8DFD6E09DBA4
  project_name: Scoreboard Redux
  project_description: Transform, filter, and summarize a list of scores with higher‑order
    functions.
  project_difficulty: Medium
  level_prerequisite: 18
  content_blocks:
  - type: heading1
    content:
      text: Scoreboard Redux
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: map/filter/reduce make data pipelines concise and readable—great for dashboards
        and analytics.
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 18 (Higher‑Order Functions)**: chain transformations for
        clarity and fewer temp variables.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: '**Step 1 — Transform:** Add a small bonus.'
      - type: snippet
        content:
          code: 'let scores = [10,25,40]

            let bonus = scores.map { $0 + 5 }'
      - type: explanation
        content:
          text: '**Step 2 — Filter:** Keep only passing scores.'
      - type: snippet
        content:
          code: let passing = bonus.filter { $0 >= 20 }
      - type: explanation
        content:
          text: '**Step 3 — Reduce:** Combine into a total.'
      - type: snippet
        content:
          code: 'let total = passing.reduce(0,+)

            print(passing, total)'
      - type: explanation
        content:
          text: '**Step 4 — Rank:**'
      - type: snippet
        content:
          code: 'let sorted = passing.sorted(by: >)

            print("Top: \(sorted.first ?? 0)")'
