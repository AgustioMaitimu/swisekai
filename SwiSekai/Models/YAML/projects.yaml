projects:
- id: C868C4EB-F0A1-429F-9EDB-601AE8BA08A1
  project_name: Quick Habit Tracker
  project_description: Track a habit with a fixed name and an evolving streak, and print friendly progress updates.
  project_difficulty: Easy
  level_prerequisite: 4
  content_blocks:
  - type: heading1
    content:
      text: Quick Habit Tracker
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: 'You''ll model a real habit with two values: a **name** that never changes and a **streak** that increases over time. This builds muscle memory for constants vs. variables and for small, safe mutations.'
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 4 (Variables & Constants)**: prefer `let` for data that shouldn''t change (habit name), `var` for data that will (streak). Use **string interpolation** to print clear feedback.'
  - type: explanation
    content:
      text: 'What you''re building: a tiny console habit tracker that shows the habit''s name, updates a daily streak, compares it to a goal, and resets when you miss a day.'
  - type: explanation
    content:
      text: 'Concepts to implement: constants vs variables (`let`/`var`), integer math (`+=`), `max` to avoid negatives, string interpolation, ternary for friendly messages.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: '**Step 1 — Declare your data (backpack vs sticker):** Use a constant for the habit name (never changes) and a variable for the streak (changes). Think: name = label, streak = counter.'
      - type: snippet
        content:
          code: |
            let habitName: String = "Read"
            var streak: Int = 0
            print("Habit: \(habitName) • Streak: \(streak) day(s)")  # Habit: Read • Streak: 0 day(s)
      - type: explanation
        content:
          text: '**Why this matters:** Choosing `let` for fixed info prevents accidental edits; choosing `var` for counters lets you update safely.'
      - type: explanation
        content:
          text: '**Step 2 — Update the streak:** Simulate a completed day by incrementing the streak with `+= 1`.'
      - type: snippet
        content:
          code: |
            streak += 1
            print("Nice! You''ve kept \(habitName) for \(streak) day(s)")  # Nice! You''ve kept Read for 1 day(s)
      - type: explanation
        content:
          text: '**Step 3 — Add a goal and report progress:** Compare the current streak to a goal and show how far you are using a ternary (`? :`).'
      - type: snippet
        content:
          code: |
            let streakGoal: Int = 7
            let remaining = max(0, streakGoal - streak)
            print(remaining == 0 ? "Goal met!" : "\(remaining) day(s) to reach \(streakGoal)")
      - type: explanation
        content:
          text: '**Step 4 — Reset logic (optional):** If you miss a day, reset the streak and print a supportive message.'
      - type: snippet
        content:
          code: |
            let missedToday = false
            if missedToday {
              streak = 0
              print("No worries! Restart \(habitName) tomorrow 💪")
            }
      - type: explanation
        content:
          text: '**Step-by-step implementation:** `let` = fixed label, `var` = changeable number, `+=` increments, `max(a,b)` prevents negatives, ternary prints one of two messages.'
      - type: explanation
        content:
          text: '**Common pitfalls:** Forgetting to use `let` for the name, letting `remaining` go negative, or not printing after updates so you cannot see state changes.'
      - type: explanation
        content:
          text: |
            **Example output:**
            Habit: Read • Streak: 0 day(s)
            Nice! You''ve kept Read for 1 day(s)
            6 day(s) to reach 7
      - type: explanation
        content:
          text: 'Milestones to verify: (1) Initial print shows name + 0-day streak; (2) After increment, message reflects new streak; (3) Goal message switches when you reach the target; (4) Reset sets streak to 0 and prints a supportive line.'
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: 'Add a celebratory message for specific milestones (e.g., 3, 7, 30). Consider pluralization: “1 day” vs “2 days”.'
- id: BAB04F4F-571D-47CF-8F7B-83D34C6C5818
  project_name: Profile Badge
  project_description: Build a one-line badge from typed values and make the text friendly for humans.
  project_difficulty: Easy
  level_prerequisite: 6
  content_blocks:
  - type: heading1
    content:
      text: Profile Badge
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: 'You''ll combine multiple basic types into a readable string. This simulates real UI text like profile headers or status labels.'
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'Grounded in **Module 6 (String Interpolation)** and type basics. Let Swift format values with `\(value)` instead of manual conversions. Add tiny logic (ternary) to produce friendly labels.'
  - type: explanation
    content:
      text: 'What you''re building: a one-line profile badge plus a status line that converts raw values into human-friendly text and handles pluralization.'
  - type: explanation
    content:
      text: 'Concepts to implement: string interpolation with `\(value)`, boolean-to-text via ternary, small copy refinements (pluralization), readable variables.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: 'Milestones to verify: (1) Badge prints with name/age/pro; (2) Status line maps boolean to a label; (3) Final sentence uses correct singular/plural.'
      - type: explanation
        content:
          text: '**Step-by-step implementation:** `\(value)` inserts values • ternary `condition ? A : B` picks a label • handle plural with a tiny `== 1 ?` check.'
      - type: explanation
        content:
          text: '**Common pitfalls:** Printing a `Bool` directly in UI, forgetting to convert booleans to friendly text, skipping pluralization.'
      - type: explanation
        content:
          text: |
            **Example output:**
            User: Mina • Age: 20 • Pro: false
            Status: Free Member
            Mina is 20 years old.
      - type: explanation
        content:
          text: '**Step 1 — Define the data:** Choose realistic values so your output reads like a real app.'
      - type: snippet
        content:
          code: |
            let name: String = "Mina"
            let age: Int = 20
            let isPro: Bool = false
      - type: explanation
        content:
          text: '**Step 2 — First pass badge:** Print a basic badge using interpolation.'
      - type: snippet
        content:
          code: |
            let badge = "User: \(name) • Age: \(age) • Pro: \(isPro)"
            print(badge)
      - type: explanation
        content:
          text: '**Step 3 — Friendlier status label:** Map your boolean to human language.'
      - type: snippet
        content:
          code: |
            let status = isPro ? "Pro Member" : "Free Member"
            print("Status: \(status)")
      - type: explanation
        content:
          text: '**Step 4 — Refine the copy:** Show a natural sentence and handle pluralization.'
      - type: snippet
        content:
          code: |
            let years = age == 1 ? "year" : "years"
            print("\(name) is \(age) \(years) old.")
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: 'Show an upsell line only when `isPro == false` (e.g., “Upgrade to Pro for more features!”). Try adding a `credits` Int and show it with a coin symbol.'
- id: 0BFE530C-2F9B-4765-BDB1-171DC160F518
  project_name: Shopping List
  project_description: Create, update, sort, and summarize a shopping list with safe index access.
  project_difficulty: Easy
  level_prerequisite: 7
  content_blocks:
  - type: heading1
    content:
      text: Shopping List
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: 'Arrays are perfect for ordered lists in apps. You''ll practice add/remove, count checks, sorting, and safe subscripting.'
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 7 (Arrays)**: use `.append`, `.remove(at:)`, `.count`, `.isEmpty`, and `sorted()` for a tidy experience.'
  - type: explanation
    content:
      text: 'What you''re building: a changing shopping list that supports add, safe remove, pretty printing, and a sorted view.'
  - type: explanation
    content:
      text: 'Concepts to implement: arrays, `.append`, safe `remove(at:)` with `indices.contains`, `.count`, loop printing, `.sorted` (non-mutating).'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: 'Milestones to verify: (1) Count reflects adds/removes; (2) Removing an out-of-range index is guarded; (3) Bulleted print lists each item; (4) Sorted output shows alphabetical order.'
      - type: explanation
        content:
          text: '**Step 1 — Start with a list:** Create an array, then print its count and contents so you see every change.'
      - type: snippet
        content:
          code: |
            var list: [String] = ["Milk", "Eggs"]
            print("Count: \(list.count) • Items: \(list)")  # Count: 2 • Items: ["Milk", "Eggs"]
      - type: explanation
        content:
          text: '**Step 2 — Add and remove safely:** Add with `.append`. Before removing by index, always check `indices.contains(idx)`.'
      - type: snippet
        content:
          code: |
            list.append("Bread")
            if list.indices.contains(1) {
              let removed = list.remove(at: 1)
              print("Removed: \(removed)")
            }
            print("Now: \(list)")  # Now: ["Milk", "Bread"]
      - type: explanation
        content:
          text: '**Step 3 — Present nicely:** Print each item on its own line with a bullet.'
      - type: snippet
        content:
          code: 'for item in list { print("• \(item)") }  # • Milk\n# • Bread'
      - type: explanation
        content:
          text: '**Step 4 — Sort for a tidy UI:** Use `.sorted()` to keep things readable.'
      - type: snippet
        content:
          code: |
            let sortedList = list.sorted()
            print("Sorted: \(sortedList)")
      - type: explanation
        content:
          text: '**Step-by-step implementation:** `.append()` add • `.remove(at:)` delete • `.count` how many • `.isEmpty` none? • `indices.contains(i)` safe access • `.sorted()` alphabetize.'
      - type: explanation
        content:
          text: '**Common pitfalls:** Removing without checking the index, mutating while iterating, or assuming `.sorted()` changes the original (it returns a new array).'
      - type: explanation
        content:
          text: |
            **Example output:**
            Count: 2 • Items: ["Milk", "Eggs"]
            Removed: Eggs
            Now: ["Milk", "Bread"]
            • Milk
            • Bread
            Sorted: ["Bread", "Milk"]
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: 'Add a `hasItem(_:)` helper using `contains` and guard against empty input when removing.'
- id: 2A9173DE-5B4F-4CE1-AE5E-5E68B92B0D67
  project_name: Student Directory
  project_description: Use a dictionary for labeled homerooms and a set for unique house colors.
  project_difficulty: Medium
  level_prerequisite: 9
  content_blocks:
  - type: heading1
    content:
      text: Student Directory
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: 'Dictionaries provide fast key→value lookups, and sets ensure items are unique—both appear everywhere in app data models.'
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Modules 8–9 (Dictionaries & Sets)**: use subscripts to add/update, `??` for safe reads, and sets to deduplicate automatically.'
  - type: explanation
    content:
      text: 'What you''re building: a directory that assigns homerooms by name and manages a set of unique house colors.'
  - type: explanation
    content:
      text: 'Concepts to implement: dictionary subscripts to add/update, `??` for defaults, set uniqueness, `.insert` to add.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: 'Milestones to verify: (1) Updating a key changes its value; (2) Missing key prints your default; (3) Set prints without duplicates after inserts.'
      - type: explanation
        content:
          text: '**Step-by-step implementation:** dictionary subscript adds/updates • `??` provides defaults • sets auto-deduplicate • `insert` adds to Set.'
      - type: explanation
        content:
          text: '**Common pitfalls:** Force-unwrapping a missing key, assuming dictionary order is stable, expecting Set to preserve order.'
      - type: explanation
        content:
          text: |
            **Example output:**
            Kai’s room: A3
            House colors: {"Blue", "Red"}
            Updated colors: {"Green", "Blue", "Red"}
      - type: explanation
        content:
          text: '**Step 1 — Define the structures:** Seed with a couple of values.'
      - type: snippet
        content:
          code: |
            var homeroom: [String: String] = ["Kai":"A2"]
            var houseColors: Set<String> = ["Red", "Blue", "Red"]
      - type: explanation
        content:
          text: '**Step 2 — Add/update entries:** Subscripts both insert and modify by key.'
      - type: snippet
        content:
          code: |
            homeroom["Zoe"] = "B1"   # insert
            homeroom["Kai"] = "A3"   # update
      - type: explanation
        content:
          text: '**Step 3 — Safe reads return optionals:** Provide a default for missing keys.'
      - type: snippet
        content:
          code: 'print("Kai’s room: \(homeroom["Kai"] ?? "N/A")")'
      - type: explanation
        content:
          text: '**Step 4 — Sets remove duplicates automatically:**'
      - type: snippet
        content:
          code: |
            print("House colors: \(houseColors)")
            houseColors.insert("Green")
            print("Updated colors: \(houseColors)")
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: 'Iterate over all keys and print a roster. If a student transfers, update their room and log the change.'
- id: CA8D4E9B-4CC5-4660-8B2F-8A3A2C58A2EB
  project_name: Fitness Points Calculator
  project_description: Compute daily points with arithmetic and conditions, then explain the bonuses.
  project_difficulty: Easy
  level_prerequisite: 10
  content_blocks:
  - type: heading1
    content:
      text: Fitness Points Calculator
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: 'You''ll combine math with comparisons to award bonuses. Clear printouts help users understand why they got a score.'
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 10 (Operators)**: arithmetic (+, -, *, /), comparison (>=), and simple boolean logic with `&&`.'
  - type: explanation
    content:
      text: 'What you''re building: a points calculator that explains base points, goal bonuses, and combo bonuses.'
  - type: explanation
    content:
      text: 'Concepts to implement: integer arithmetic, comparisons, boolean AND `&&`, ternary for final summary.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: 'Milestones to verify: (1) Base points match your inputs; (2) Step goal adds bonus only at threshold; (3) Combo bonus requires both conditions; (4) Final message shows correct total.'
      - type: explanation
        content:
          text: '**Step-by-step implementation:** base = simple math • bonus with `if` • combine with `&&` • final message via ternary.'
      - type: explanation
        content:
          text: '**Common pitfalls:** Integer division `steps / 1000` floors values; consider `Double` if you need decimals.'
      - type: explanation
        content:
          text: |
            **Example output:**
            Base points: 18
            Step goal bonus +3
            Great day! 21 pts
      - type: explanation
        content:
          text: '**Step 1 — Inputs and base score:** Start from simple numbers for easy testing.'
      - type: snippet
        content:
          code: |
            let steps = 6500
            let workouts = 1
            var points = (steps / 1000) * 2 + (workouts * 5)
            print("Base points: \(points)")
      - type: explanation
        content:
          text: '**Step 2 — Goals and bonuses:** Apply a step bonus when the goal is met.'
      - type: snippet
        content:
          code: 'if steps >= 8000 { points += 3; print("Step goal bonus +3") }'
      - type: explanation
        content:
          text: '**Step 3 — Stretch bonus:** Combine conditions with AND.'
      - type: snippet
        content:
          code: 'if steps >= 8000 && workouts >= 2 { points += 5; print("Combo bonus +5") }'
      - type: explanation
        content:
          text: '**Step 4 — Final message:** Provide clear feedback.'
      - type: snippet
        content:
          code: 'print(points >= 15 ? "Great day! \(points) pts" : "Keep going: \(points) pts")'
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: Extract the bonus logic into functions for easier testing and reuse.
- id: CE8F3500-9C02-4B5B-AFBE-DEF9DEB06621
  project_name: Access Gate
  project_description: Validate ticket first with `guard`, then branch on age.
  project_difficulty: Easy
  level_prerequisite: 11
  content_blocks:
  - type: heading1
    content:
      text: Access Gate
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: This shows how early‑exit validation keeps your main path unindented and easier to read.
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 11 (Conditions)**: prefer `guard` for required conditions and `if/else` for branching choices.'
  - type: explanation
    content:
      text: 'What you''re building: an entry checker that validates a ticket first, then branches on age.'
  - type: explanation
    content:
      text: 'Concepts to implement: `guard` for required preconditions, `if/else` for branching, early returns to keep code flat.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: 'Milestones to verify: (1) Guard prints a ticket message and returns early; (2) Adults welcome path prints; (3) Underage path prints a different warning.'
      - type: explanation
        content:
          text: '**Step-by-step implementation:** prefer `guard` for required checks • use `if/else` for branching • keep inputs easy to tweak.'
      - type: explanation
        content:
          text: '**Common pitfalls:** Doing work before validating, forgetting `return` after `guard` fails, deeply nested `if` chains.'
      - type: explanation
        content:
          text: |
            **Example output:**
            Welcome!
            Ticket required
      - type: explanation
        content:
          text: '**Step 1 — Model inputs:** Keep them easy to tweak while testing.'
      - type: snippet
        content:
          code: |
            let age = 17
            let hasTicket = true
      - type: explanation
        content:
          text: '**Step 2 — Gate function with guard:** Exit early if the requirement fails.'
      - type: snippet
        content:
          code: |
            func enter(age: Int, hasTicket: Bool) {
              guard hasTicket else { print("Ticket required"); return }
              if age >= 18 { print("Welcome!") } else { print("Need an adult") }
            }
            enter(age: age, hasTicket: hasTicket)
      - type: explanation
        content:
          text: '**Step 3 — Variations:** Try different values to ensure each branch prints correctly.'
      - type: snippet
        content:
          code: |
            enter(age: 20, hasTicket: true)
            enter(age: 16, hasTicket: false)
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: 'Add a `vip` flag that bypasses age checks, but still requires a ticket.'
- id: DAA35ED6-38D8-468E-A54F-3DAE637DA865
  project_name: Countdown Display
  project_description: 'Compare `for-in`, `while`, and `repeat-while` to print short sequences.'
  project_difficulty: Easy
  level_prerequisite: 12
  content_blocks:
  - type: heading1
    content:
      text: Countdown Display
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: 'Repetition is everywhere—learn which loop fits which scenario and how to keep loop logic simple.'
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 12 (Loops)**: ranges for fixed loops; `while` for pre-check; `repeat-while` for do‑then‑check.'
  - type: explanation
    content:
      text: 'What you''re building: three short counters that demonstrate `for-in`, `while`, and `repeat-while` behaviors.'
  - type: explanation
    content:
      text: 'Concepts to implement: reversed ranges, pre-check `while`, at-least-once `repeat-while`, updating counters safely.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: 'Milestones to verify: (1) Reversed count prints 3,2,1 then Go!; (2) `while` prints 0..2; (3) `repeat-while` prints 0 at least once.'
      - type: explanation
        content:
          text: '**Step-by-step implementation:** ranges for fixed counts • `while` pre-check • `repeat-while` at-least-once.'
      - type: explanation
        content:
          text: '**Common pitfalls:** Off-by-one errors with ranges, forgetting to increment in loops, infinite loops.'
      - type: explanation
        content:
          text: |
            **Example output:**
            3
            2
            1
            Go!
            0
            0
            1
      - type: explanation
        content:
          text: '**Step 1 — for‑in with a reversed range:** Perfect for fixed cycles.'
      - type: snippet
        content:
          code: |
            for n in (1...3).reversed() { print(n) }
            print("Go!")
      - type: explanation
        content:
          text: '**Step 2 — while for pre‑check conditions:** Runs zero or more times.'
      - type: snippet
        content:
          code: |
            var i = 0
            while i < 3 { print(i); i += 1 }
      - type: explanation
        content:
          text: '**Step 3 — repeat‑while for at‑least‑once:** Useful for prompt loops.'
      - type: snippet
        content:
          code: |
            var n = 0
            repeat { print(n); n += 1 } while n < 1
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: Print only even numbers from 0...10 using a loop of your choice.
- id: FE3C5A42-96CA-46CB-938A-44E74F83EB9F
  project_name: Math Toolkit
  project_description: Create small, reusable helpers and test them with sample data.
  project_difficulty: Medium
  level_prerequisite: 13
  content_blocks:
  - type: heading1
    content:
      text: Math Toolkit
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: 'Functions make logic reusable and testable—great for calculators, utilities, and pipeline steps.'
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 13 (Functions)**: keep functions small, name them clearly, and prefer returning values over printing inside.'
  - type: explanation
    content:
      text: 'What you''re building: a tiny utility library with standalone, testable functions.'
  - type: explanation
    content:
      text: 'Concepts to implement: pure functions, clear names, returning values instead of printing, simple tests with `print`.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: 'Milestones to verify: (1) `isEven` returns true/false correctly; (2) `cube` returns n*n*n; (3) `average` handles empty arrays and computes correct mean.'
      - type: explanation
        content:
          text: '**Step-by-step implementation:** store closures in arrays • run them with `forEach` • add typed parameters when needed.'
      - type: explanation
        content:
          text: '**Common pitfalls:** Forgetting parentheses to invoke a closure, mismatched closure types, capturing unintended external variables.'
      - type: explanation
        content:
          text: |
            **Example output:**
            Hi
            HEY!
            • Swift
      - type: explanation
        content:
          text: '**Step 1 — Define helpers:** Start with simple, testable functions.'
      - type: snippet
        content:
          code: |
            func isEven(_ n:Int) -> Bool { n % 2 == 0 }
            func cube(_ n:Int) -> Int { n*n*n }
      - type: explanation
        content:
          text: '**Step 2 — Try them out:**'
      - type: snippet
        content:
          code: |
            print(isEven(4))  # true
            print(cube(3))    # 27
      - type: explanation
        content:
          text: '**Step 3 — Extend the set:** Add an average helper for arrays.'
      - type: snippet
        content:
          code: |
            func average(_ values:[Double]) -> Double {
              guard !values.isEmpty else { return 0 }
              var total = 0.0
              for v in values { total += v }
              return total / Double(values.count)
            }
            print(average([1,2,3,4]))  # 2.5
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: 'Write `clamp(_ value:min:max:)` that limits a number into a range.'
- id: 170F58E0-3F63-472A-800A-D5B17CC72B86
  project_name: Readable Moves
  project_description: Make calls that read like sentences using external parameter labels.
  project_difficulty: Medium
  level_prerequisite: 14
  content_blocks:
  - type: heading1
    content:
      text: Readable Moves
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
