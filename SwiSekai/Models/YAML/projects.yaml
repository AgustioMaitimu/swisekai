- id: 92348F8B-469A-43E1-B951-B88A973884F9
  project_name: Nickname Helper
  project_description: Handle missing nicknames with safe unwrapping and clear messages.
  project_difficulty: Medium
  level_prerequisite: 25
  content_blocks:
  - type: heading1
    content:
      text: Nickname Helper
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: 'Optionals make absence explicit. Your job: unwrap safely and present helpful output—never crash.'
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 25 (Optionals)**: use `if let` / `guard let` for safe paths; avoid `!` unless guaranteed non‑nil.'
  - type: explanation
    content:
      text: 'What you''re building: a tiny greeter that safely unwraps an optional nickname and prints a friendly message.'
  - type: explanation
    content:
      text: 'Concepts to implement: optional `String?`, `if let` to unwrap, `guard let` inside a function with early return, avoiding force unwrap.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: 'Milestones to verify: (1) `if let` path greets by nickname; (2) Else path prints a fallback; (3) Function version uses `guard let` and returns early on nil.'
      - type: explanation
        content:
          text: '**Step 1 — Optional variable:**'
      - type: snippet
        content:
          code: |
            var nick: String? = nil
            nick = "Ace"
      - type: explanation
        content:
          text: '**Step 2 — if let (peek safely):** Use `if let` to open the optional box only when a value exists. Inside the `if` block, `n` is a non‑optional `String`.'
      - type: snippet
        content:
          code: 'if let n = nick { print("Hi, \(n)") } else { print("No nick") }'
      - type: explanation
        content:
          text: '**Step-by-step implementation:** `String?` may be nil • `if let n = nick { ... }` unwraps safely • avoid `!` unless you are 100% sure.'
      - type: explanation
        content:
          text: '**Step 3 — guard let in a function:**'
      - type: snippet
        content:
          code: |
            func greet(_ name:String?) {
              guard let n = name else { print("Missing name"); return }
              print("Yo, \(n)")
            }
            greet(nick)
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: 'Return a greeting `String` from `greet(_:)` instead of printing so you can use it in UI.'
- id: 731BA00A-EE23-464B-A4FC-B2DCA6BD6E00
  project_name: Shape Casting
  project_description: Inspect mixed values and act based on runtime type safely.
  project_difficulty: Medium
  level_prerequisite: 26
  content_blocks:
  - type: heading1
    content:
      text: Shape Casting
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: 'When working with `Any`, you’ll need to check and cast carefully—prefer `as?` plus conditionals.'
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 26 (Typecasting)**: use `is` to check, `as?` to cast safely, and avoid `as!` unless certain.'
  - type: explanation
    content:
      text: 'What you''re building: a loop that inspects mixed values and performs different actions for Ints, Strings, and everything else.'
  - type: explanation
    content:
      text: 'Concepts to implement: `Any` container, `as?` for safe casts, conditional branches for each concrete type, avoiding `as!`.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: 'Milestones to verify: (1) Int branch doubles numbers; (2) String branch prefixes text; (3) Other branch handles the rest without crashing.'
      - type: explanation
        content:
          text: '**Step-by-step implementation:** use `is` to check type • cast safely with `as?` • avoid `as!` unless certain.'
      - type: explanation
        content:
          text: '**Common pitfalls:** Crashing with `as!`, forgetting to handle the `else` case after `as?`, assuming `Any` retains methods of the original type.'
      - type: explanation
        content:
          text: |
            **Example output:**
            10
            Text: Hi
            Other
      - type: explanation
        content:
          text: '**Step 1 — Mixed bag:**'
      - type: snippet
        content:
          code: 'let items:[Any] = ["Hi", 5, 2.0]'
      - type: explanation
        content:
          text: '**Step 2 — Inspect and handle:**'
      - type: snippet
        content:
          code: |
            for item in items {
              if let n = item as? Int { print(n * 2) }
              else if let s = item as? String { print("Text: \(s)") }
              else { print("Other") }
            }
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: 'Add a `Drawable` protocol with `draw()` and call it only when `item as? Drawable` succeeds.'
- id: 79CEAEBC-6917-4655-BA2F-C2DFAEAF5E94
  project_name: Lazy Gallery
  project_description: Load expensive data only when first accessed, then reuse it.
  project_difficulty: Medium
  level_prerequisite: 27
  content_blocks:
  - type: heading1
    content:
      text: Lazy Gallery
  - type: heading2
    content:
      text: Project Overview
  - type: explanation
    content:
      text: 'Lazy properties defer cost until needed—great for caches, images, or computations.'
  - type: heading2
    content:
      text: Core Concepts
  - type: explanation
    content:
      text: 'From **Module 27 (Access Control & Laziness)**: use `lazy` with a closure initializer and show the first‑access effect.'
  - type: explanation
    content:
      text: 'What you''re building: a lazy-loaded list where the initial access prints a load message only once, then reuses the cached data.'
  - type: explanation
    content:
      text: 'Concepts to implement: `lazy` stored property with a closure initializer, demonstrating first-access effect, showing reuse without reloading.'
  - type: collapsible_section
    content:
      title: Step-by-Step Implementation
      blocks:
      - type: explanation
        content:
          text: 'Milestones to verify: (1) "Before access" prints first; (2) Access triggers a single "Loading..."; (3) Next prints show cached data without another load.'
      - type: explanation
        content:
          text: '**Step 1 — Define the loader:**'
      - type: snippet
        content:
          code: |
            struct Gallery {
              lazy var images:[String] = {
                print("Loading...")
                return ["a","b","c"]
              }()
            }
      - type: explanation
        content:
          text: '**Step 2 — Demonstrate laziness:**'
      - type: snippet
        content:
          code: |
            var g = Gallery()
            print("Before access")
            print(g.images)   # triggers load
            print("After access")
  - type: heading2
    content:
      text: Next Steps
  - type: explanation
    content:
      text: Move the load logic into a separate function, then call it from the lazy property for better testability.
  - type: explanation
    content:
      text: 'Milestones to verify: (1) "Before access" prints first; (2) Access triggers a single "Loading..."; (3) Next prints show cached data without another load.'
