        content:
          code: 'enum LoadError: Error { case missing, unreadable }'
      - type: explanation
        content:
          text: '**Step 2 — Throwing function:** Signal failure with `throws`.'
      - type: snippet
        content:
          code: |
            func load(name:String) throws -> String {
              throw LoadError.missing
            }
      - type: explanation
        content:
          text: '**Step 3 — Handle outcomes:** Separate success from recovery.'
      - type: snippet
        content:
          code: |
            do {
              let _ = try load(name:"data.json")
              print("Loaded")
            } catch LoadError.missing {
              print("File not found")
            } catch {
              print("Unknown error: \(error)")
            }
      - type: explanation
        content:
          text: '**Step 4 — Optional shortcut:**'
      - type: snippet
        content:
          code: |
            let maybe = try? load(name:"config.json")
            print(maybe ?? "Using defaults")
